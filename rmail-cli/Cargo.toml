[package]
name = "rmail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `mail` command-line client — a thin gRPC client for rmaild."

[[bin]]
name = "mail"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["onnx"]
# Forwarded so `--workspace --no-default-features` actually builds the degraded
# daemon. Without it, this crate's default-features dependency on `rmail-core`
# re-enables ONNX and the "no model" path is never compiled, let alone tested.
onnx = ["rmail-core/onnx", "rmaild/onnx"]

[dependencies]
rmail-core.workspace = true
rmail-proto.workspace = true
tonic-health.workspace = true
tokio.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
rmaild.workspace = true
rmail-core.workspace = true
rmail-proto.workspace = true
tokio = { workspace = true, features = ["process"] }
