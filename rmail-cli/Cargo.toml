[package]
name = "rmail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `mail` command-line client — a thin gRPC client for rmaild."
# Not published to crates.io — ships as a binary release (see
# `scripts/package-macos.sh`), not a library. Lets `deny.toml`'s
# `bans.allow-wildcard-paths` distinguish an unversioned `path` dependency on
# a sibling crate (harmless, always local) from a real external wildcard
# dependency (a supply-chain risk worth denying).
publish = false

[[bin]]
name = "mail"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["onnx"]
# Forwarded so `--workspace --no-default-features` actually builds the degraded
# daemon. Without it, this crate's default-features dependency on `rmail-core`
# re-enables ONNX and the "no model" path is never compiled, let alone tested.
onnx = ["rmail-core/onnx", "rmaild/onnx"]

# `rmaild` is now a real dependency (for `mail mcp serve`), not only a
# dev-dependency, so this crate's own default features must not silently
# re-enable ONNX in it — the same reason the workspace declaration sets
# `default-features = false`.

[dependencies]
rmail-core.workspace = true
rmail-proto.workspace = true
# `mail mcp serve` (task 53) launches `rmaild::mcp`'s projected tool surface.
# The MCP adapter lives in the daemon crate because that is where the scope
# table it joins against lives; this crate only chooses a transport, so it
# names no RPC — see `mcp_cli`'s own module docs.
rmaild.workspace = true
tonic-health.workspace = true
# `mail api reflect`/`mail api call` (task 42) discover what the daemon serves
# by asking its reflection service, rather than trusting the descriptor set
# this binary happens to have been compiled with. Only the generated *client*
# stubs are used here; they are not behind the crate's `server` feature, which
# `rmaild` (a dependency of this crate) turns on regardless.
tonic-reflection.workspace = true
# `format::response_json` re-encodes a generated response message so the
# descriptor-driven codec can render it as proto JSON; `api_call` decodes the
# `FileDescriptorProto`s reflection returns.
prost.workspace = true
prost-types.workspace = true
# `daemon_cli::stop` sends SIGTERM to the pid `mail daemon start` recorded —
# the signal `rmaild::shutdown_signal` waits for. Already resolved
# transitively; this only promotes it to a direct dependency.
libc.workspace = true
# `note_cli`'s `$EDITOR` flow launches the user's editor as a child process.
tokio = { workspace = true, features = ["process"] }
# `tui::grpc` cancels its in-flight background RPC tasks (and the long-lived
# WatchEvents stream) when the TUI exits, rather than leaving them to notice
# their result channel closed at some later point.
tokio-util.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
# The TUI shell (task 83). Its crossterm backend is `ratatui::crossterm`; see
# the workspace dependency's own note for why crossterm is not listed here.
ratatui.workspace = true
clap.workspace = true
chrono.workspace = true
# `outbox_cli` renders a scheduled send's instant in the IANA zone it was
# scheduled in, which the entry carries as a name.
chrono-tz.workspace = true
serde.workspace = true
# `mail ai summary --json`.
serde_json.workspace = true
# `keys.toml` (task 84): the TUI's key bindings, parsed on their own rather
# than layered through figment — already in the tree, so no new code or
# license surface (see the workspace `Cargo.toml`'s own note).
toml.workspace = true
# `keymap` reports what it did with `keys.toml` through `tracing`. This crate
# installs no subscriber today, so the user-visible channel is still the TUI's
# status line; the spans are here for `RUST_LOG` when something needs
# debugging without a status line to read.
tracing.workspace = true
# `mail mcp serve` is the one verb that runs unattended for hours, so it
# installs a **stderr** subscriber of its own — stdout is the JSON-RPC channel
# under `--stdio` and must carry nothing else. No other verb installs one.
tracing-subscriber.workspace = true
thiserror.workspace = true
# `auth_cli`'s masked prompt for `mail auth setup`/`mail auth login`.
rpassword.workspace = true
# `tui::undo`'s idempotency keys (task 112).
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `session`'s cached client-auth token store — the macOS Keychain, reached
# through the same `security-framework` generic-password API
# `rmail_core::oauth::store` already uses for OAuth refresh tokens. A second,
# CLI-only dependency on it (rather than exposing this through `rmail-core`)
# because caching *this* crate's own session token is transport/client
# plumbing specific to `mail`/the TUI, not daemon-side domain logic the way
# OAuth grant custody is.
security-framework.workspace = true

[dev-dependencies]
rmaild.workspace = true
rmail-core.workspace = true
rmail-proto.workspace = true
tokio = { workspace = true, features = ["process"] }
# `tui::grpc`'s tests implement `rmail_core::imap::mutate::ImapMutator`, which
# is an `#[async_trait]` trait, so the impl needs the same attribute.
async-trait.workspace = true
