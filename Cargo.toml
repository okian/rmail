[workspace]
resolver = "2"
members = ["rmail-proto", "rmail-core", "rmaild", "rmail-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

# Non-negotiables from CLAUDE.md: no unwrap/expect/panic/todo in non-test code.
# `allow-*-in-tests` (clippy.toml) exempts test code so this is a hard gate for
# production paths only.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
rmail-proto = { path = "rmail-proto" }
rmail-core = { path = "rmail-core" }
rmaild = { path = "rmaild" }

tonic = "0.12"
tonic-types = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
tonic-build = "0.12"
prost = "0.13"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
security-framework = "3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
futures = "0.3"
mail-parser = "0.9"
html2text = "0.12"
regex = "1"
sha2 = "0.10"
whatlang = "0.16"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
