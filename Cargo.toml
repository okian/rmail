[workspace]
resolver = "2"
members = ["rmail-proto", "rmail-core", "rmaild", "rmail-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

# Non-negotiables from CLAUDE.md: no unwrap/expect/panic/todo in non-test code.
# `allow-*-in-tests` (clippy.toml) exempts test code so this is a hard gate for
# production paths only.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
rmail-proto = { path = "rmail-proto" }
# `default-features = false` here, not only at the use sites: cargo *ignores*
# a member's `default-features = false` when the workspace declaration does not
# set it, so without this the `onnx` feature can never actually be turned off
# and the degraded build is never compiled.
rmail-core = { path = "rmail-core", default-features = false }
# As with `rmail-core`: cargo ignores a member's `default-features = false`
# unless the workspace declaration sets it, and this one is a dev-dependency of
# `rmail-cli`, where default features are enabled regardless of the command
# line — which quietly re-enabled `onnx` for the whole workspace.
rmaild = { path = "rmaild", default-features = false }

# `tls-webpki-roots` (which implies `tls`) for the CLI's `--addr`/`--tls-*`
# global flags (task 42): a gRPC client that can reach a TCP endpoint needs a
# TLS stack, and `mail --addr` without one could only ever speak plaintext.
# It selects `tokio-rustls` with `default-features = false` and `ring` — the
# same single provider the `tokio-rustls` declaration below pins — so this adds
# no second crypto provider and no cmake build; the only crate it introduces is
# `rustls-pemfile`, the PEM parser from the rustls project. `webpki-roots` is
# already a direct dependency here, so the default trust anchors cost nothing
# new either.
tonic = { version = "0.12", features = ["tls-webpki-roots"] }
tonic-types = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    # `hooks::run_hook` (task 67) spawns a hook's configured command via
    # `tokio::process::Command` and drains its stdout/stderr concurrently
    # with writing its stdin via `AsyncReadExt`/`AsyncWriteExt` — "process"
    # gates the former, "io-util" the latter's extension-trait methods.
    "process",
    "io-util",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
# Standalone TOML for documents that are *not* layered config: the eval
# golden set (task 37) is a single committed file parsed on its own, so
# figment's provider/merge machinery buys nothing and would obscure the
# schema-version check `eval::golden` needs to make. Already in the tree as a
# figment dependency, so this adds no third-party code or license surface.
toml = "0.8"
# `functions`: application-defined SQL scalar functions. Used by
# `retrieve::cancel`'s own test (task 28) to make cross-thread
# `sqlite3_interrupt()` cancellation observable — a custom `tick()` function
# is the row counter that proves a cancelled scan was genuinely interrupted
# mid-flight rather than merely abandoned by its caller.
# `hooks` is `analytics::sql`'s sandbox (task 72): a SQLite authorizer is what
# confines a model-written statement to the read-only `analytics_*` views, and
# it is enforced by SQLite's own name resolution rather than by a regex over a
# string — which is the only version of that check worth having.
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }
r2d2 = "0.8"
sqlite-vec = "0.1"
# For `sqlite3_auto_extension`. Version-locked to whatever `rusqlite` resolves
# so both halves of the process see one SQLite.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
r2d2_sqlite = "0.25"
refinery = { version = "0.8", features = ["rusqlite"] }
security-framework = "3"
# `rmail-cli::auth_cli`'s masked terminal prompt for `mail auth setup/login`
# (client_auth): a password must never echo to the terminal or land in shell
# history/scrollback the way a `--password` flag would. A small,
# single-purpose wrapper over termios (Unix) / the console mode API
# (Windows) for exactly this one job, rather than hand-rolling raw-mode
# toggling for one string field.
rpassword = "7"
# Apple Vision framework bindings for on-device OCR (index.extract.ocr's
# default backend, macOS only — see rmail-core/src/attach/ocr.rs).
# `default-features = false` everywhere here: each crate's default feature set
# pulls in every request/type family it knows about (face detection, body
# pose, barcode scanning, CoreML, ...), none of which this binary calls; naming
# only the text-recognition path keeps both the FFI surface and the audit
# burden to what is actually linked.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSObject",
    "NSString",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFCGTypes",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest",
    "VNObservation", "VNTypes", "VNGeometry", "objc2-core-foundation",
] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
# `default-features = false`: the default pulls `aws-lc-rs`, and with `ring`
# also in the tree (via reqwest and via hf-hub's client) rustls has two
# providers to choose from and refuses — at runtime, on the first handshake.
# Naming one provider here removes the ambiguity structurally and drops a large
# C/asm cmake build from the tree; `install_crypto_provider` is belt-and-braces.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# A direct dependency so the process can install a provider explicitly rather
# than relying on rustls inferring one from crate features — inference fails as
# soon as anything in the tree enables a second provider, and it fails at
# runtime on the first handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures = "0.3"
# The MCP adapter's SSE transport (task 53) serves plain HTTP/1.1 on a
# loopback port. Already in the tree under tonic, so naming it here promotes a
# transitive dependency to a direct one rather than adding code to the build.
# `server` + `http1` only: the gRPC side keeps using tonic's own hyper wiring,
# and an MCP client speaks HTTP/1.1.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
http-body-util = "0.1"
# `rmaild::mcp::invoke` implements `tonic::codec::Codec` over already-encoded
# message bodies, which means using `Buf`/`BufMut` directly. Also already in
# the tree via tonic and prost.
bytes = "1"
# `hooks::kill_process_group` (task 67): killing a whole POSIX process
# group (`kill(-pid, SIGKILL)`) rather than only the one pid
# `tokio::process::Child::start_kill` tracks — needed so a timed-out hook
# that forked children (the documented `sh -c "cmd1; cmd2"` pattern) does
# not leave them running. Already resolved transitively by nearly every
# dependency in this tree; this is only promoting it to a direct one.
libc = "0.2"
mail-parser = "0.9"
# MIME transfer encoding for outbound mail (`rmail-core::compose::mime`):
# base64 bodies and RFC 2047 `B` encoded-words. Already in the tree as a
# transitive dependency, so this only promotes it to a direct one.
base64 = "0.22"
html2text = "0.12"
# OpenPGP for the auto-encrypt path (`rmail-core::crypto`): parsing discovered
# transferable public keys, and PGP/MIME encryption of outbound mail.
#
# rPGP rather than `sequoia-openpgp` because it is pure Rust. Sequoia's default
# backend is Nettle, which needs a C toolchain plus `pkg-config` at build time
# — a host dependency the `scripts/docker-test.sh` image does not carry and
# which would make the gate's build depend on the developer's machine.
#
# `default-features = false` drops the `bzip2` default, which is a C library
# for a compression algorithm essentially unused in OpenPGP messages; zlib and
# zip stay available, and rPGP treats an unsupported algorithm on a *received*
# key as a parse error rather than a panic. `getrandom` for the OS RNG that
# session keys are drawn from — encryption cannot be correct without it.
#
# NOTE: this brings `rsa` and RUSTSEC-2023-0071 into the tree. See `deny.toml`
# for why the advisory does not apply to how this crate is used, and for the
# condition under which that stops being true.
pgp = { version = "0.20", default-features = false, features = ["getrandom"] }
# The CSPRNG rPGP's encryption API takes by reference. Pinned to 0.8 because
# that is the major rPGP's public signatures are written against — a 0.9 `Rng`
# here would not satisfy `encrypt_to_key`'s bound, and the mismatch surfaces as
# an inscrutable trait error rather than a version conflict. Already in the
# tree via rPGP; this promotes it to a direct dependency.
rand = "0.8"
# Attachment text extraction. `pdf-extract` carries ~100 panicking call sites,
# so it is always driven from an isolated task whose panic is caught — a
# malformed PDF is a thing a mailbox receives, not an exceptional event.
pdf-extract = "0.12"
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
encoding_rs = "0.8"
regex = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # `Response::bytes_stream()`, for decoding the Anthropic Messages API's
    # SSE stream as it arrives instead of buffering the whole response.
    "stream",
] }
# The local embedding backend. `ort-download-binaries-rustls-tls` keeps the
# ONNX Runtime fetch on the same TLS stack as the rest of the workspace rather
# than dragging in a second one.
fastembed = { version = "5", default-features = false, features = [
    "hf-hub-rustls-tls",
    "ort-download-binaries-rustls-tls",
] }
sha2 = "0.10"
# Web Key Directory (`rmail-core::crypto::discover::wkd`) hashes the local part
# of an address with SHA-1 and z-base-32s the result to form the lookup path.
# That is not a security use and the choice is not ours: the algorithm is fixed
# by the WKD draft, and computing anything else produces a URL no WKD server
# will answer. Already in the tree via rPGP; this promotes it to a direct
# dependency so the call site is not reaching through another crate's exports.
sha1 = "0.10"
# Capability-token secret hashing (task 38). `std` for the OS RNG the CLI/admin
# service uses to mint tokens; default features otherwise (password-hash+rand).
argon2 = { version = "0.5", features = ["std"] }
whatlang = "0.16"
unicode-normalization = "0.1"
# The fuzzy retriever's subsequence scorer (task 28) — skim/fzf-style
# matching with the same bonus/penalty shape prd.md's Part III fuzzy-finder
# spec describes, without re-deriving that DP by hand for Part I's much
# narrower use (subject/sender fields only, see `retrieve::fuzzy`).
nucleo-matcher = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA zone database, for scheduled send (task 61). `chrono` alone knows
# fixed offsets and the *system* local zone; neither can answer "09:00 on
# March 8th in America/Los_Angeles", which is precisely what freezing a
# scheduled send into an absolute instant requires. Without a zone database a
# DST transition is invisible and the message goes out an hour early or late.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# SMTP submission (task 61). `default-features = false` drops `builder` — we
# render RFC 5322 ourselves in `compose::mime` and hand those octets to
# `AsyncTransport::send_raw` verbatim — and `native-tls`, since the workspace
# is rustls/`ring` throughout (see the `tokio-rustls` note above; lettre's
# rustls feature selects `ring` as well, so no second crypto provider enters
# the tree). `pool` is what gives prd.md's "per-account connection reuse".
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-rustls-tls",
    "hostname",
    "tracing",
] }
clap = { version = "4", features = ["derive", "env"] }
# The TUI (task 83). 0.29, not 0.30: every 0.30 release declares a
# `rust-version` above this workspace's own 1.80, and 0.29 declares 1.74.
# crossterm is deliberately not listed — the TUI uses `ratatui::crossterm`;
# see `rmail-cli/src/tui.rs`'s module docs.
ratatui = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Perf-budget benchmarks (`rmail-core/benches/`) only; not a runtime dep of
# any shipped binary. `default-features = false`: the defaults pull in
# `rayon` (parallel measurement, unused — this file benchmarks single-threaded
# SQLite calls) and `plotters` (SVG/gnuplot report rendering this file's
# assertions don't need) for roughly fifteen extra crates this task's actual
# use doesn't touch. `cargo_bench_support` is the one default feature that is
# load-bearing: without it, a `[[bench]] harness = false` target does not
# integrate with the `cargo bench` CLI at all.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
# Link-time memory, not compile time, is what constrains this workspace's test
# gate. `scripts/docker-test.sh` runs in a container the Docker VM caps at
# 7.7 GB, and a full debug link of this dependency tree — 257 object files per
# test binary, plus statically-linked onnxruntime, SQLite, ring and the ICU
# tables — is dominated by DWARF. Twenty-one test binaries linking at `nproc`
# parallelism reliably got `ld` SIGKILLed by the OOM killer, which reads as a
# code failure and is not one.
#
# `line-tables-only` keeps exactly what a failing test needs — file, line and
# symbol in a backtrace — and drops the type/variable DWARF that a debugger
# would want but CI never looks at. It is not "no debug info": `panic!`
# locations and `RUST_BACKTRACE` output are unchanged. Anyone stepping through
# under a debugger can override it locally with
# `CARGO_PROFILE_DEV_DEBUG=full`.
#
# `[profile.dev]` covers `[profile.test]` too — test targets inherit dev — but
# both are stated so neither is changed by accident.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
