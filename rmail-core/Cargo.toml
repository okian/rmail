[package]
name = "rmail-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core domain, storage, sync, index, search, and AI logic for rmail."

[lints]
workspace = true

[features]
default = ["onnx"]
# The local ONNX embedding backend. Off, `provider = "local"` degrades to the
# deterministic hashing embedder rather than failing: the PRD's rule is that
# search works offline and without a model, only less well.
onnx = ["dep:fastembed"]

[dependencies]
tonic.workspace = true
tonic-types.workspace = true
tower.workspace = true
hyper-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
sqlite-vec.workspace = true
libsqlite3-sys.workspace = true
r2d2_sqlite.workspace = true
refinery.workspace = true
async-imap.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
mail-parser.workspace = true
html2text.workspace = true
pdf-extract.workspace = true
calamine.workspace = true
zip.workspace = true
quick-xml.workspace = true
encoding_rs.workspace = true
regex.workspace = true
async-trait.workspace = true
reqwest.workspace = true
fastembed = { workspace = true, optional = true }
sha2.workspace = true
argon2.workspace = true
whatlang.workspace = true
unicode-normalization.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
# Enable figment's `Jail` sandbox for isolated env/file config tests.
figment = { workspace = true, features = ["test"] }
