syntax = "proto3";

package rmail.v1;

import "google/protobuf/empty.proto";
import "rmail/v1/mail.proto";

// SearchService is the ranked-retrieval surface described in prd.md Part I:
// query understanding -> multi-source candidate generation -> fusion ->
// feature extraction -> L1 ranking -> diversify/present, streamed back
// best-first. `Search` runs the full cascade (respecting `SearchRequest.mode`
// and the daemon's configured retrievers); `Semantic` is the dense-only
// subset prd.md calls out as its own entry point; `Explain` re-derives a
// specific message's ranking rationale for the identical query without
// truncating to the L1 top-K, so a message outside the presented page can
// still be explained.
//
// Every RPC here is read-only over the local index — no IMAP round trip, no
// mutation — so the daemon can answer as fast as SQLite allows.
service SearchService {
  // Streams ranked hits best-first as the pipeline produces them. The first
  // hit is flushed as soon as it has been fully presented, before the rest of
  // the page has been diversified/snippeted — see `rmaild::search_service`'s
  // module docs for why that ordering is safe for every intent, not just
  // navigational.
  //
  // A fresh `Search`/`Semantic` call cancels whichever `Search`/`Semantic`
  // stream is still running (a single shared "current query" slot, the same
  // shape a TUI's debounced keystroke-driven search box needs). The older
  // call keeps whatever it had already produced and then terminates with
  // CANCELLED — never a clean OK, because the slot is daemon-wide and the
  // client that lost it is not necessarily the client that took it: an `OK`
  // would hand an unrelated caller a silently truncated page.
  rpc Search (SearchRequest) returns (stream SearchHit);

  // As `Search`, but candidate generation is restricted to the dense-vector
  // retriever alone (prd.md: "dense only") regardless of `SearchRequest.mode`
  // — paraphrase/semantic recall with no lexical/fuzzy/entity contribution.
  // Participates in the same generation-token cancellation as `Search`.
  rpc Semantic (SearchRequest) returns (stream SearchHit);

  // Why a specific message ranked where it did for `query` — the full
  // per-feature contribution breakdown, computed directly from that
  // candidate's own feature vector rather than truncated to the streamed
  // page's top-K, so a message the client already knows about (e.g. from a
  // prior page) can still be explained even if it would not have made this
  // request's own `limit`/`top_k_rerank` cut.
  rpc Explain (ExplainRequest) returns (RankExplanation);

  // Score a golden set against this corpus — prd.md's "Relevance is
  // measured, not asserted" harness (task 37). Each `EvaluateRequest.queries`
  // entry is run through the identical pipeline `Search` uses, its results
  // scored against that entry's judgments, and the per-query plus aggregate
  // NDCG@10 / MRR / Recall@50 / P@3 returned.
  //
  // Unary rather than streaming: a report is only meaningful once every
  // query in the set has run (the headline numbers are macro-averages), so
  // there is nothing a caller could usefully do with a partial one.
  //
  // Judgments arrive by value rather than as a path to a golden-set file so
  // the daemon needs no filesystem access to whatever directory the client
  // happens to be running in — the client parses and validates the file
  // (`rmail_core::eval::GoldenSet`) and sends its contents.
  //
  // Read-only, like every other RPC here: evaluating a golden set never
  // writes to the index or the feedback log.
  rpc Evaluate (EvaluateRequest) returns (EvalReport);

  // Record what the user did with the results of a previous search — prd.md's
  // implicit-feedback learning loop (task 64). `FeedbackRequest.query_id`
  // comes from `SearchHit.query_id`; the actions are opens, replies,
  // archives, dwells and scroll-pasts against message ids from that same
  // page.
  //
  // This is the only RPC in this file that writes anything, and it is
  // deliberately the only one that touches the feedback log *at all*: there
  // is no companion RPC that reads impressions, actions or logged queries
  // back out. That absence is the surface half of prd.md's "it is local
  // telemetry, never transmitted" — a serialized feature vector is a
  // behavioural fingerprint of a mailbox, and the way to keep it on the
  // machine is not to build a way off it.
  //
  // The *impression* half of the log is not accepted here and cannot be. An
  // impression carries the exact feature vector its result was ranked by, and
  // only the daemon that ran the ranker has it — a client-supplied vector
  // would be a re-derivation at best and a forgery at worst, and training on
  // either is how a ranker silently gets worse. The daemon therefore writes
  // impressions itself, from the vectors its own L1 ranker scored, once the
  // page has been streamed.
  //
  // Never an error when `search.learning = false`: recording nothing is the
  // correct response to "record this" when recording is off, and a client
  // should not have to special-case a setting it does not own. Nothing is
  // written either way.
  rpc LogFeedback (FeedbackRequest) returns (google.protobuf.Empty);
}

// Execution mode: which candidate sources contribute. `MODE_UNSPECIFIED`
// defers to the daemon's configured `search.default_mode`.
enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_LEXICAL = 1;
  MODE_SEMANTIC = 2;
  MODE_HYBRID = 3;
}

// Which L2 reranker (prd.md Stage 5) re-orders the top-K.
// `RERANK_UNSPECIFIED` defers to the daemon's configured `search.rerank`;
// the other values override it for this one request (`mail search --rerank
// claude`). Reranking is always best-effort: whichever backend is asked for,
// a failure, an unprovisioned model, or an exhausted AI budget degrades to
// the L1 order rather than failing the search.
enum Rerank {
  RERANK_UNSPECIFIED = 0;
  // No rerank; the L1 order stands.
  RERANK_OFF = 1;
  // The local ONNX cross-encoder — offline, no egress.
  RERANK_CROSS_ENCODER = 2;
  // Claude listwise over the top ~30, with a one-line "why" per result
  // (SearchHit.why.claude_reason). Costs a provider call.
  RERANK_CLAUDE = 3;
  // The cross-encoder for interactive search, Claude for a deep one.
  RERANK_AUTO = 4;
}

// Search intent, as prd.md's Stage 0 classifies it. `INTENT_UNSPECIFIED`
// lets the query planner classify it from the query text; a client that sets
// one of the other values overrides that classification (e.g. a `--explore`
// CLI flag forcing EXPLORATORY to force MMR diversification on).
enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_NAVIGATIONAL = 1;
  INTENT_EXPLORATORY = 2;
  INTENT_LOOKUP = 3;
}

message SearchRequest {
  // Free text plus inline operators (`from:alice -tag:newsletter "office
  // move"`) — the same grammar `mail search` accepts at the CLI.
  string query = 1;
  // Additional operator-DSL text, space-joined onto `query` before parsing.
  // Exists so a caller that already keeps `query` and `filter` as separate UI
  // fields (a search box plus an operator picker) does not have to
  // string-build one field itself; the grammar has no distinct "filter
  // language" of its own — a `filter` value is parsed by the identical rules
  // as free-typed query text.
  string filter = 2;
  Mode mode = 3;
  // Overrides the classified intent; INTENT_UNSPECIFIED lets the planner
  // decide.
  Intent intent = 4;
  // Results to present, after ranking/diversification. 0 = search.default_limit.
  uint32 limit = 5;
  // Include a RankExplanation on every SearchHit.
  bool explain = 6;
  // Collapse a thread to its best-scoring message (fuse::Fuser::fuse's own
  // `thread_collapse` argument — a per-request presentation choice, not a
  // deployment-wide config default).
  bool thread_collapse = 7;
  // Restrict to one account; 0 = every configured account.
  int64 account_id = 8;
  // Override `search.rerank` for this request. RERANK_UNSPECIFIED uses the
  // daemon's configured policy.
  //
  // A request may only ask for *less* than the daemon is configured to do:
  // RERANK_OFF and RERANK_CROSS_ENCODER are always honored, while
  // RERANK_CLAUDE/RERANK_AUTO are honored only when `search.rerank` already
  // selects Claude. `Search` is authorized by the ordinary mail-read scope,
  // and a read token must not be able to turn a local-index query into a
  // paid, egressing provider call the operator never sanctioned.
  Rerank rerank = 9;
  // Declare this an explicit "deep search" rather than interactive typing:
  // slower and more expensive is acceptable. Only `rerank = RERANK_AUTO`
  // (the configured default) reads it — that is the flag prd.md's "`auto`
  // uses the cross-encoder for interactive typing and Claude for explicit
  // 'deep search'" resolves against. An explicit RERANK_* value already says
  // which backend to use and ignores this.
  bool deep = 10;
}

// A byte range into a Snippet's `text` — never embedded markup, so every
// client renders its own highlighting instead of inheriting one renderer's
// escaping bugs. `end` is exclusive.
message ByteRange {
  uint32 start = 1;
  uint32 end = 2;
}

message Snippet {
  string text = 1;
  repeated ByteRange highlights = 2;
}

message SearchHit {
  Message message = 1;
  // The ranking score, comparable only within this one streamed response —
  // never across two different queries, rerank passes, or intents (see
  // rank::RankedCandidate's own doc comment).
  //
  // With no L2 rerank this is the L1 ranker's score for this candidate. When
  // a rerank ran it is still drawn from that response's L1 score
  // distribution, but re-assigned to express the reranked order: sorting hits
  // by this field always reproduces the order they were streamed in, which is
  // the property clients need. `why.score` (with `explain`) is always this
  // candidate's own L1 score, and is the one whose feature contributions sum
  // back to it.
  double score = 2;
  Snippet snippet = 3;
  // Which retrievers surfaced this message ("lexical", "dense", "fuzzy",
  // "entity", "structured", "prefix", "recency").
  repeated string sources = 4;
  // Present when SearchRequest.explain was set, and also — carrying only
  // `claude_reason` and `score` — when an L2 Claude rerank produced a reason
  // for this hit, so `mail search --rerank claude` gets the one-line "why"
  // it paid for without also asking for the full feature breakdown.
  RankExplanation why = 5;
  optional int64 thread_id = 6;
  // Sibling messages collapsed into this one by thread_collapse.
  repeated int64 thread_collapsed = 7;
  // Sibling messages collapsed as SimHash near-duplicates.
  repeated int64 near_duplicates = 8;
  // The id of the search that produced this hit — pass it back to
  // `LogFeedback` to attribute an action to this page. Identical on every hit
  // of one response.
  //
  // 0 means this search was not logged, so there is nothing to attribute to:
  // either `search.learning = false` (the opt-out; nothing at all was
  // written) or the stream was superseded by a fresher query before it
  // finished. A client should send no feedback for a 0.
  int64 query_id = 9;
}

message FeatureContribution {
  // FeatureName::as_str()'s stable string — the same key [search.rank_weights]
  // overrides on, never a positional index.
  string name = 1;
  double value = 2;
  double weight = 3;
  // weight * value; summing every contribution's weighted_contribution
  // reproduces RankExplanation.score exactly.
  double weighted_contribution = 4;
}

message RankExplanation {
  // Empty when this explanation exists only to carry `claude_reason` (see
  // SearchHit.why).
  repeated FeatureContribution features = 1;
  // The score the L1 ranker actually produced for this candidate under this
  // query's intent — always this candidate's own, even after an L2 rerank
  // reordered the page (unlike SearchHit.score; see its comment). When
  // `features` is non-empty, summing every
  // FeatureContribution.weighted_contribution reproduces this exactly.
  double score = 2;
  repeated string sources = 3;
  // The matched span(s) prd.md's explainability section asks for.
  Snippet matched = 4;
  // The L2 Claude reranker's one-line "why this matched". Empty when no
  // rerank ran, when the cross-encoder ran (it produces a logit and no
  // prose), or when the rerank degraded to the L1 order.
  string claude_reason = 5;
}

message ExplainRequest {
  string query = 1;
  string filter = 2;
  Intent intent = 3;
  int64 message_id = 4;
  bool thread_collapse = 5;
  int64 account_id = 6;
}

// One relevance judgment: a message the golden set says is a correct answer,
// and how correct.
message Judgment {
  // RFC 5322 `Message-ID` header, verbatim (`"<abc@example.com>"`) — not a
  // `messages.id`. Row ids are assigned by insertion order and change on any
  // resync, so a *versioned* golden set keyed on them would keep parsing
  // fine while silently scoring different mail; see
  // `rmail_core::eval::golden`'s module docs.
  string message_id = 1;
  // Relevance grade, 1..=3 (`rmail_core::eval::metrics::MAX_GAIN`). 0 is
  // read as "unset" and treated as 1 — proto3 cannot distinguish an absent
  // scalar from a zero one, and an ungraded golden set (the common case)
  // sends no gain at all.
  uint32 gain = 2;
}

// One judged query from a golden set.
message GoldenQuery {
  // Stable short name, unique within the request — how a per-query metric is
  // reported and how a regression is attributed.
  string name = 1;
  // The query string, exactly as `mail search` would take it.
  string query = 2;
  // Restrict to one account; 0 = every account.
  int64 account_id = 3;
  repeated Judgment judgments = 4;
}

message EvaluateRequest {
  // Free-form name of the corpus the judgments were made against, echoed
  // back on the report. Never interpreted — it exists so a stored report
  // says which mailbox produced it, since these metrics are corpus-relative
  // and a number from one corpus says nothing about another.
  string corpus = 1;
  repeated GoldenQuery queries = 2;
  // Which retrievers contribute, as `Search`. MODE_UNSPECIFIED defers to the
  // daemon's `search.default_mode` — evaluating the shipped configuration is
  // the default because that is the thing a regression guard is guarding.
  Mode mode = 3;
  // Results to fetch per query. Clamped up to 50: Recall@50 over a shorter
  // page is unmeasurable rather than merely low. 0 = 50.
  uint32 limit = 4;
}

// The four metrics prd.md names, for one query or macro-averaged over a set.
message EvalMetrics {
  double ndcg_at_10 = 1;
  double mrr = 2;
  double recall_at_50 = 3;
  double p_at_3 = 4;
}

message QueryEval {
  string name = 1;
  string query = 2;
  EvalMetrics metrics = 3;
  // Results the pipeline returned, before any metric cutoff.
  uint32 returned = 4;
  // Judged-relevant messages that resolved against this corpus.
  uint32 relevant = 5;
  // Golden `Message-ID`s no message in this corpus matched. Non-empty means
  // the metrics above understate the ranker — the fixture did not seed, or
  // the mailbox is not fully synced — which is a corpus failure, not a
  // relevance one, and is surfaced rather than silently scored as a miss.
  repeated string unresolved = 6;
}

message EvalReport {
  string corpus = 1;
  // One entry per request query, in request order.
  repeated QueryEval per_query = 2;
  // Macro-average across queries: every query weighted equally regardless of
  // how many relevant messages it has.
  EvalMetrics aggregate = 3;
}

// What a user did with a search result. prd.md's implicit-feedback vocabulary
// exactly — "opened, replied to, archived-from-results, dwelled on (and how
// long), scrolled past" — and nothing beyond it: each of the five is
// something the trainer knows how to weight, and an action it cannot weight
// is a row that costs disk and teaches nothing.
enum FeedbackAction {
  FEEDBACK_ACTION_UNSPECIFIED = 0;
  // The result was opened. The baseline positive signal.
  FEEDBACK_ACTION_OPEN = 1;
  // The user replied to the message. The strongest positive.
  FEEDBACK_ACTION_REPLY = 2;
  // Archived straight from the result list — a mild *negative* for this
  // query, not a neutral event.
  FEEDBACK_ACTION_ARCHIVE = 3;
  // Time spent on the message; `ResultAction.dwell_ms` carries how long and
  // is required for this action.
  FEEDBACK_ACTION_DWELL = 4;
  // Skipped over on the way to something lower down the page. What makes a
  // "clicked ≻ skipped-above" preference a pair rather than a lone positive.
  FEEDBACK_ACTION_SCROLL_PAST = 5;
}

// One observation about one result of one search.
message ResultAction {
  // The message acted on (`Message.id`). Must be one this query actually
  // showed: an action about a result that was never on the page has no
  // position and no feature vector to attribute itself to, so it is rejected
  // with INVALID_ARGUMENT rather than stored as a label out of thin air.
  int64 message_id = 1;
  FeedbackAction action = 2;
  // Milliseconds spent on the message. Required for FEEDBACK_ACTION_DWELL —
  // how long *is* the signal — and rejected on every other action, which
  // would otherwise give the same measurement two competing definitions.
  // Capped at 24h: a longer "dwell" is a bug or a forgery, and because
  // long-dwell outranks a plain open, one absurd value would dominate every
  // real signal in the corpus.
  //
  // `optional` rather than a bare int64 because 0 is a real dwell (the user
  // opened and immediately left, which is a genuine negative) and proto3
  // cannot otherwise distinguish it from "not measured".
  optional int64 dwell_ms = 3;
  // When it happened, unix seconds. 0 = the daemon stamps its own clock,
  // which is the right default for a local client on the same machine.
  // Negative is rejected.
  int64 at = 4;
}

message FeedbackRequest {
  // `SearchHit.query_id` from the page these actions are about. 0 is
  // rejected: it is the wire sentinel for "that search was not logged", so
  // there is nothing to attribute to.
  int64 query_id = 1;
  // The batch. Empty is accepted and does nothing; the batch is applied
  // atomically, so a rejected action rejects the whole request rather than
  // leaving a partial picture (a result recorded as skipped that was in fact
  // opened is a wrong training label, not a missing one).
  repeated ResultAction actions = 2;
}
