syntax = "proto3";

package rmail.v1;

import "google/protobuf/empty.proto";
import "rmail/v1/mail.proto";

// SearchService is the ranked-retrieval surface described in prd.md Part I:
// query understanding -> multi-source candidate generation -> fusion ->
// feature extraction -> L1 ranking -> diversify/present, streamed back
// best-first. `Search` runs the full cascade (respecting `SearchRequest.mode`
// and the daemon's configured retrievers); `Semantic` is the dense-only
// subset prd.md calls out as its own entry point; `Explain` re-derives a
// specific message's ranking rationale for the identical query without
// truncating to the L1 top-K, so a message outside the presented page can
// still be explained.
//
// Every RPC here is read-only over the local index — no IMAP round trip, no
// mutation — so the daemon can answer as fast as SQLite allows.
service SearchService {
  // Streams ranked hits best-first as the pipeline produces them. The first
  // hit is flushed as soon as it has been fully presented, before the rest of
  // the page has been diversified/snippeted — see `rmaild::search_service`'s
  // module docs for why that ordering is safe for every intent, not just
  // navigational.
  //
  // A fresh `Search`/`Semantic` call cancels whichever `Search`/`Semantic`
  // stream is still running (a single shared "current query" slot, the same
  // shape a TUI's debounced keystroke-driven search box needs). The older
  // call keeps whatever it had already produced and then terminates with
  // CANCELLED — never a clean OK, because the slot is daemon-wide and the
  // client that lost it is not necessarily the client that took it: an `OK`
  // would hand an unrelated caller a silently truncated page.
  rpc Search (SearchRequest) returns (stream SearchHit);

  // As `Search`, but candidate generation is restricted to the dense-vector
  // retriever alone (prd.md: "dense only") regardless of `SearchRequest.mode`
  // — paraphrase/semantic recall with no lexical/fuzzy/entity contribution.
  // Participates in the same generation-token cancellation as `Search`.
  rpc Semantic (SearchRequest) returns (stream SearchHit);

  // Why a specific message ranked where it did for `query` — the full
  // per-feature contribution breakdown, computed directly from that
  // candidate's own feature vector rather than truncated to the streamed
  // page's top-K, so a message the client already knows about (e.g. from a
  // prior page) can still be explained even if it would not have made this
  // request's own `limit`/`top_k_rerank` cut.
  rpc Explain (ExplainRequest) returns (RankExplanation);

  // Score a golden set against this corpus — prd.md's "Relevance is
  // measured, not asserted" harness (task 37). Each `EvaluateRequest.queries`
  // entry is run through the identical pipeline `Search` uses, its results
  // scored against that entry's judgments, and the per-query plus aggregate
  // NDCG@10 / MRR / Recall@50 / P@3 returned.
  //
  // Unary rather than streaming: a report is only meaningful once every
  // query in the set has run (the headline numbers are macro-averages), so
  // there is nothing a caller could usefully do with a partial one.
  //
  // Judgments arrive by value rather than as a path to a golden-set file so
  // the daemon needs no filesystem access to whatever directory the client
  // happens to be running in — the client parses and validates the file
  // (`rmail_core::eval::GoldenSet`) and sends its contents.
  //
  // Read-only, like every other RPC here: evaluating a golden set never
  // writes to the index or the feedback log.
  rpc Evaluate (EvaluateRequest) returns (EvalReport);

  // Record what the user did with the results of a previous search — prd.md's
  // implicit-feedback learning loop (task 64). `FeedbackRequest.query_id`
  // comes from `SearchHit.query_id`; the actions are opens, replies,
  // archives, dwells and scroll-pasts against message ids from that same
  // page.
  //
  // This is the only RPC in this file that writes anything, and it is
  // deliberately the only one that touches the feedback log *at all*: there
  // is no companion RPC that reads impressions, actions or logged queries
  // back out. That absence is the surface half of prd.md's "it is local
  // telemetry, never transmitted" — a serialized feature vector is a
  // behavioural fingerprint of a mailbox, and the way to keep it on the
  // machine is not to build a way off it.
  //
  // The *impression* half of the log is not accepted here and cannot be. An
  // impression carries the exact feature vector its result was ranked by, and
  // only the daemon that ran the ranker has it — a client-supplied vector
  // would be a re-derivation at best and a forgery at worst, and training on
  // either is how a ranker silently gets worse. The daemon therefore writes
  // impressions itself, from the vectors its own L1 ranker scored, once the
  // page has been streamed.
  //
  // Never an error when `search.learning = false`: recording nothing is the
  // correct response to "record this" when recording is off, and a client
  // should not have to special-case a setting it does not own. Nothing is
  // written either way.
  rpc LogFeedback (FeedbackRequest) returns (google.protobuf.Empty);

  // Compile plain English into a query in rmail's own grammar — prd.md's
  // Stage 0 step 7, "NL → plan (Claude, cached)" (task 58). `mail search
  // --nl "who did I forget to reply to about the lease?"`.
  //
  // This is the one RPC in this file that leaves the machine, which is why it
  // is separate from `Search` rather than a flag on it. `Search` is authorized
  // by the ordinary mail-read scope and clamps itself to whatever provider
  // work the operator already sanctioned (see `SearchRequest.rerank`); a
  // compile *is* a provider call, so it carries `ai.invoke` as well and cannot
  // be reached by a read-only token.
  //
  // It also runs nothing. A plan comes back for a client to show and a human
  // to confirm — prd.md's "confirmable" — and running it is an ordinary
  // `Search` with `QueryPlan.compiled` as the query. Compiling and searching
  // in one call would spend the user's money on a query they had not agreed
  // to yet, and would give the daemon two entry points that differ in whether
  // a search can cost anything.
  //
  // Cached by normalized query hash, per account, so re-asking the same
  // question — including from `mail folder new`, which compiles through this
  // same cache — is free. `CompileQueryRequest.refresh` is the escape hatch.
  rpc CompileQuery (CompileQueryRequest) returns (QueryPlan);

  // Rank *attachments* rather than the messages that carried them (prd.md
  // feature 55): "the contract clause about termination for convenience"
  // returns the exact attachment and page.
  //
  // A different key, which is why it is a different RPC rather than a flag on
  // `Search`. A message with a signed contract and a signature-block logo is
  // one row in the message index covering both, and nothing about that row
  // can say which of the two the clause came from. This one fuses a BM25 arm
  // over per-attachment extracted text with the chunk-level embedding kNN,
  // via the same RRF and the same `search.rrf_k` the message pipeline uses,
  // and resolves each winner's byte offset to a page.
  //
  // Read-only over the local index, like every other RPC here, and scoped
  // like `Search` for the same reason `Search` is: the embedding arm uses
  // whichever backend `index.semantic` already indexes the mailbox with — a
  // caller can neither select nor escalate it — so calling this grants no
  // spend authority the operator's own configuration had not already granted.
  //
  // Unary rather than streamed, unlike `Search`. The whole page's order is
  // only known once both arms have been fused, and every hit is then
  // hydrated in a single batched read — there is no prefix of the answer that
  // becomes correct earlier, so streaming would buy a cancellation contract
  // and a generation slot for no latency at all.
  rpc SearchAttachments (SearchAttachmentsRequest) returns (SearchAttachmentsResponse);

  // Search the extracted entity graph — amounts, dates, invoice and order
  // references, tracking numbers, IBANs, addresses, phones, URLs — and return
  // the mail behind each hit (prd.md feature 4).
  //
  // # How this differs from IndexService.ListEntities
  //
  // ListEntities is an index-maintenance read: one kind, required, listed, so
  // an operator can see what the extractor produced. This is a search — free
  // text across kinds, scoped to an account and a time window, ranked by how
  // much of the mailbox stands behind each hit, and it carries a bounded
  // sample of the messages back with it. That is what makes "the invoice
  // number that keeps turning up in three threads" a question with an answer.
  //
  // Nothing here runs an extractor or calls a model: it reads what the
  // entities index stage already wrote, so a mailbox whose entity stage is
  // disabled answers with no hits rather than with an error.
  //
  // INVALID_ARGUMENT for a query longer than the daemon's ceiling, or for a
  // kind string no version of this code writes — a typo'd kind and a kind
  // with no entities are very different answers.
  rpc SearchEntities (SearchEntitiesRequest) returns (SearchEntitiesResponse);

  // Distil the local feedback log into ranker weights, evaluate the result on
  // a held-out slice, and hot-swap the model **only** on a measured NDCG@10
  // win (prd.md, "Training"; task 65). The same job the nightly loop runs, on
  // demand.
  //
  // The response is the whole verdict, including the two numbers it is a
  // comparison of, because "nothing changed" has two very different causes —
  // there was nothing to learn, or what was learned would have made search
  // worse — and an operator has to be able to tell them apart.
  //
  // A candidate the guardrail *refuses* is a successful call, not an error:
  // `accepted` is false, the live model is untouched, and the refused
  // candidate is still written to `ranker_model` so the refusal is auditable
  // through `ListRankerModels`.
  //
  // FAILED_PRECONDITION when there is too little feedback to train on, or
  // when the held-out slice carries too little engagement for its verdict to
  // mean anything — refusing to judge beats reporting a tie as a result.
  //
  // Nothing here leaves the machine: it reads the local log, fits weights in
  // process, and writes a local row. There is deliberately no way to import
  // or export a model.
  rpc TrainRanker (TrainRankerRequest) returns (RankerTrainingReport);

  // The model history — every training run's candidate, accepted or refused,
  // with the held-out numbers that decided it, plus which model is actually
  // live.
  //
  // Carries no weights and no queries: a weight table is a behavioural
  // fingerprint of a mailbox, and this RPC exists so an operator can see
  // *verdicts*, not so a model can be read off the machine.
  rpc ListRankerModels (ListRankerModelsRequest) returns (ListRankerModelsResponse);

  // Put an earlier model back — prd.md's "Old model kept for rollback."
  //
  // With no `model_id`, steps back to the newest accepted model older than
  // whatever is live, and to the deterministic cold-start scorer when there
  // is none; repeated calls therefore walk backwards through history and stop
  // there rather than oscillating. With a `model_id`, goes straight to it.
  //
  // FAILED_PRECONDITION for a model the guardrail refused: an operator who
  // could hand-activate a candidate measured worse would be able to undo the
  // guardrail, and training again on more feedback is the way forward from a
  // refused run. NOT_FOUND for an id with no row.
  rpc RollbackRanker (RollbackRankerRequest) returns (RollbackRankerResponse);
}

message TrainRankerRequest {
  // Run everything — read, label, fit, evaluate — and change nothing. The
  // answer to "what would tonight's job do", and the only way to see a
  // candidate's held-out numbers without risking the live model.
  bool dry_run = 1;
}

// One training run's verdict.
message RankerTrainingReport {
  // Logged queries in the training slice, and the preference pairs derived
  // from them. Both matter: a mailbox with many searches and few clicks
  // produces the first number and not the second.
  uint32 train_queries = 1;
  uint32 train_pairs = 2;
  // The held-out slice, and how many of its queries carried any engagement.
  // The second number is what decides whether the comparison below says
  // anything at all — NDCG over a slice nobody clicked in is 0.0 for every
  // model.
  uint32 holdout_queries = 3;
  uint32 holdout_engaged = 4;
  // Logged queries dropped as unreplayable (an intent this build does not
  // know, an undecodable feature vector). Reported rather than swallowed: a
  // run that silently ignored most of the corpus would still produce a model.
  uint32 skipped_queries = 5;
  // NDCG@10 over the held-out slice for the model that was live, and for the
  // candidate — scored the same way, over the same impressions.
  double baseline_ndcg_at_10 = 6;
  double candidate_ndcg_at_10 = 7;
  // The margin the candidate had to clear (`search.training.min_ndcg_gain`).
  double min_gain = 8;
  // Whether the swap happened — so always false for a dry run, even one whose
  // candidate cleared the guardrail. A client asking "would tonight swap"
  // computes it from the three fields above
  // (`candidate_ndcg_at_10 - baseline_ndcg_at_10 >= min_gain`, and strictly
  // positive) rather than reading this, which is deliberately the narrow
  // question "did anything change" so nothing can mistake a measurement for
  // an effect.
  bool accepted = 9;
  bool dry_run = 10;
  // Propensity-weighted pairwise loss before and after fitting. "The loss went
  // down" and "search got better" are different claims; only the second one
  // swaps a model, and seeing both is how a run that learned nothing is told
  // apart from one that learned the wrong thing.
  double initial_loss = 11;
  double final_loss = 12;
  // The `ranker_model` row this run wrote; 0 when it wrote none (a dry run).
  int64 model_id = 13;
  // The model live after this call; 0 means the deterministic scorer.
  int64 active_model_id = 14;
  // One line a human can read without the numbers.
  string verdict = 15;
}

message ListRankerModelsRequest {
  // Rows to return, newest first. 0 = the daemon's default.
  uint32 limit = 1;
}

// One stored candidate model. Never its weights — see `ListRankerModels`.
message RankerModel {
  int64 id = 1;
  // Unix seconds.
  int64 created_at = 2;
  // Model family. `linear` for everything this build trains or runs.
  string kind = 3;
  // `accepted` — cleared the guardrail and may be made live.
  // `rejected`  — did not, and can never be activated.
  string status = 4;
  // Whether this row carries the stored `active` flag. This can disagree with
  // `ListRankerModelsResponse.active_model_id` in exactly one case: a stored
  // model this build cannot decode leaves the flag on disk while the
  // deterministic scorer runs. That is reported rather than hidden, and a
  // rollback is the fix.
  bool active = 5;
  uint32 train_queries = 6;
  uint32 train_pairs = 7;
  uint32 eval_queries = 8;
  uint32 eval_engaged = 9;
  double baseline_ndcg_at_10 = 10;
  double candidate_ndcg_at_10 = 11;
  string note = 12;
}

message ListRankerModelsResponse {
  // Newest first.
  repeated RankerModel models = 1;
  // What the live ranker is actually running; 0 means the deterministic
  // cold-start scorer, which is what every mailbox with no accepted model
  // runs.
  int64 active_model_id = 2;
}

message RollbackRankerRequest {
  // The model to make live. 0 means "step back one" — see `RollbackRanker`.
  int64 model_id = 1;
}

message RollbackRankerResponse {
  // The model live after the call; 0 means the deterministic scorer.
  int64 active_model_id = 1;
  // One line a human can read.
  string detail = 2;
}

message SearchEntitiesRequest {
  // Free text, matched case-insensitively against both an entity's canonical
  // form and the text as written. Empty lists everything in scope, ranked.
  // `%` and `_` are matched literally, not as wildcards.
  string query = 1;
  // Restrict to these kinds: email | phone | url | amount | date |
  // tracking_no | order_id | invoice_id | iban. Empty means every kind.
  // (`entities.kind` also admits person/org/address, which no extractor in
  // this build writes; naming one is INVALID_ARGUMENT, not an empty page.)
  repeated string kinds = 2;
  // Restrict to one account; 0 means every configured account.
  int64 account_id = 3;
  // Only entities mentioned by mail at or after this instant, Unix seconds.
  // 0 means no lower bound.
  int64 since = 4;
  // Page size; 0 means the daemon's default. Clamped to its ceiling.
  int64 limit = 5;
}

// One message that mentions an entity, enough to place the hit without a
// second round trip.
message EntityMention {
  int64 message_id = 1;
  string subject = 2;
  // Unix seconds; 0 when the message carries no date.
  int64 date = 3;
  // Which `index_content` part the mention was found in.
  string part = 4;
  // Byte offsets into that part's normalized text, for highlighting.
  int64 span_start = 5;
  int64 span_end = 6;
}

message EntityHit {
  int64 entity_id = 1;
  string kind = 2;
  // As written, for display.
  string value = 3;
  // The canonical form — the identity `UNIQUE(kind, norm)` keys on, so
  // `Ada@Example.COM` and `ada@example.com` are one hit.
  string norm = 4;
  // Kind-specific detail as JSON: the currency and minor units of an amount,
  // the carrier of a tracking number.
  string meta = 5;
  // Mentions across every message in scope.
  int64 mentions = 6;
  // Distinct messages in scope that mention it.
  int64 messages = 7;
  // The most recent of those messages, Unix seconds; 0 when none carried a
  // date.
  int64 last_seen = 8;
  // A bounded sample of those messages, most recent first. Bounded because
  // the point of an example is to place a hit, not to re-implement search:
  // returning every mention of a URL that appears in nine hundred
  // newsletters would make the response a function of the mailbox.
  repeated EntityMention examples = 9;
}

message SearchEntitiesResponse {
  repeated EntityHit hits = 1;
}

message CompileQueryRequest {
  // The plain-English question, as typed. Bounded server-side
  // (`rmail_core::query::compile::MAX_INPUT_LEN`); a longer one is
  // INVALID_ARGUMENT rather than truncated, because a truncated question
  // compiles to a plan for a different question.
  string query = 1;
  // Which account the plan is compiled for. The plan cache is per account,
  // and AI policy/budget resolve against it, so this is required: 0 names no
  // account and is INVALID_ARGUMENT.
  int64 account_id = 2;
  // Recompile even if a cached plan exists, replacing it. For a user who
  // looks at what came back and wants a second opinion.
  bool refresh = 3;
}

// A compiled natural-language query — prd.md's confirmable plan.
//
// Deliberately narrower than `rmail_core::query::plan::QueryPlan`, which also
// carries spelling corrections, corpus synonyms and a query embedding. Those
// are derived from this mailbox at search time and would go stale in a cache;
// what is worth compiling once and confirming with a human is the *structure*
// the sentence turned out to have.
message QueryPlan {
  // The plain-English input, trimmed.
  string raw = 1;
  // The compiled query, in rmail's operator grammar — exactly what `mail
  // search` takes. Re-parsed by the daemon on every use; nothing downstream
  // trusts it as a plan.
  string compiled = 2;
  // Each recognized operator rendered back as `key:value` (`-` prefixed when
  // negated), for a confirmation line. Derived by re-parsing `compiled`, not
  // by asking the model to describe its own answer.
  repeated string filters = 3;
  // The free-text half of `compiled`: what the lexical and dense retrievers
  // rank on, and what a smart folder embeds.
  string semantic_query = 4;
  // The classified intent.
  Intent intent = 5;
  // The model's one-line note about what it understood. Display only —
  // nothing branches on it.
  string notes = 6;
  // Whether this answer came from the plan cache. `true` means no provider
  // call was made and nothing was charged.
  bool cached = 7;
  // Which model compiled it, and when (unix seconds).
  string model = 8;
  int64 compiled_at = 9;
}

message SearchAttachmentsRequest {
  // The query. Free text and quoted phrases; a phrase is matched as a phrase
  // in the lexical arm and used to place the excerpt.
  string query = 1;
  // Restrict to one account; 0 means every configured account.
  int64 account_id = 2;
  // Restrict to one message's attachments; 0 means every message — what a
  // client uses to search inside the message already on screen.
  int64 message_id = 3;
  // How many attachments to return; 0 means the daemon's default. Clamped to
  // the daemon's own ceiling.
  uint32 limit = 4;
}

// One attachment that matched.
message AttachmentHit {
  int64 message_id = 1;
  int64 message_uid = 2;
  int64 account_id = 3;
  string mailbox = 4;
  // The carrying message's subject and From address, so a hit is placeable
  // without a second round trip.
  string subject = 5;
  string from_addr = 6;
  optional int64 date = 7;
  // The MIME part id, which addresses the attachment for
  // MailService.GetAttachment and AttachmentService.AskAttachment.
  string part_id = 8;
  string filename = 9;
  string content_type = 10;
  // Decoded size in bytes, when recorded.
  optional int64 bytes = 11;
  // How many pages extraction found, when the format has them.
  optional int64 pages = 12;
  // The page the evidence falls on, one-based. Unset for a format with no
  // pages, or an offset no page span covers.
  optional int64 page = 13;
  // Byte offsets of the evidence within the attachment's extracted text.
  // `span_end` equals `span_start` when the offset came from a term match
  // rather than an embedded chunk.
  int64 span_start = 14;
  int64 span_end = 15;
  // A verbatim excerpt of the attachment's own text around the evidence,
  // drawn from the local index.
  string excerpt = 16;
  // native | ocr — whether the text was read out of the format or recognized
  // from pixels. A hit on OCR'd text is real, but it is a guess about pixels
  // rather than a fact read out of a format.
  string provenance = 17;
  // Fused reciprocal-rank score, higher is better.
  double score = 18;
  // This attachment's 1-based rank in each arm, unset when that arm did not
  // return it. Present so a client (and an operator reading a trace) can see
  // which retrieval actually found a result.
  optional uint32 lexical_rank = 19;
  optional uint32 dense_rank = 20;
}

message SearchAttachmentsResponse {
  repeated AttachmentHit hits = 1;
}

// Execution mode: which candidate sources contribute. `MODE_UNSPECIFIED`
// defers to the daemon's configured `search.default_mode`.
enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_LEXICAL = 1;
  MODE_SEMANTIC = 2;
  MODE_HYBRID = 3;
}

// Which L2 reranker (prd.md Stage 5) re-orders the top-K.
// `RERANK_UNSPECIFIED` defers to the daemon's configured `search.rerank`;
// the other values override it for this one request (`mail search --rerank
// claude`). Reranking is always best-effort: whichever backend is asked for,
// a failure, an unprovisioned model, or an exhausted AI budget degrades to
// the L1 order rather than failing the search.
enum Rerank {
  RERANK_UNSPECIFIED = 0;
  // No rerank; the L1 order stands.
  RERANK_OFF = 1;
  // The local ONNX cross-encoder — offline, no egress.
  RERANK_CROSS_ENCODER = 2;
  // Claude listwise over the top ~30, with a one-line "why" per result
  // (SearchHit.why.claude_reason). Costs a provider call.
  RERANK_CLAUDE = 3;
  // The cross-encoder for interactive search, Claude for a deep one.
  RERANK_AUTO = 4;
}

// Search intent, as prd.md's Stage 0 classifies it. `INTENT_UNSPECIFIED`
// lets the query planner classify it from the query text; a client that sets
// one of the other values overrides that classification (e.g. a `--explore`
// CLI flag forcing EXPLORATORY to force MMR diversification on).
enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_NAVIGATIONAL = 1;
  INTENT_EXPLORATORY = 2;
  INTENT_LOOKUP = 3;
}

message SearchRequest {
  // Free text plus inline operators (`from:alice -tag:newsletter "office
  // move"`) — the same grammar `mail search` accepts at the CLI.
  string query = 1;
  // Additional operator-DSL text, space-joined onto `query` before parsing.
  // Exists so a caller that already keeps `query` and `filter` as separate UI
  // fields (a search box plus an operator picker) does not have to
  // string-build one field itself; the grammar has no distinct "filter
  // language" of its own — a `filter` value is parsed by the identical rules
  // as free-typed query text.
  string filter = 2;
  Mode mode = 3;
  // Overrides the classified intent; INTENT_UNSPECIFIED lets the planner
  // decide.
  Intent intent = 4;
  // Results to present, after ranking/diversification. 0 = search.default_limit.
  uint32 limit = 5;
  // Include a RankExplanation on every SearchHit.
  bool explain = 6;
  // Collapse a thread to its best-scoring message (fuse::Fuser::fuse's own
  // `thread_collapse` argument — a per-request presentation choice, not a
  // deployment-wide config default).
  bool thread_collapse = 7;
  // Restrict to one account; 0 = every configured account.
  int64 account_id = 8;
  // Override `search.rerank` for this request. RERANK_UNSPECIFIED uses the
  // daemon's configured policy.
  //
  // A request may only ask for *less* than the daemon is configured to do:
  // RERANK_OFF and RERANK_CROSS_ENCODER are always honored, while
  // RERANK_CLAUDE/RERANK_AUTO are honored only when `search.rerank` already
  // selects Claude. `Search` is authorized by the ordinary mail-read scope,
  // and a read token must not be able to turn a local-index query into a
  // paid, egressing provider call the operator never sanctioned.
  Rerank rerank = 9;
  // Declare this an explicit "deep search" rather than interactive typing:
  // slower and more expensive is acceptable. Only `rerank = RERANK_AUTO`
  // (the configured default) reads it — that is the flag prd.md's "`auto`
  // uses the cross-encoder for interactive typing and Claude for explicit
  // 'deep search'" resolves against. An explicit RERANK_* value already says
  // which backend to use and ignores this.
  bool deep = 10;
}

// A byte range into a Snippet's `text` — never embedded markup, so every
// client renders its own highlighting instead of inheriting one renderer's
// escaping bugs. `end` is exclusive.
message ByteRange {
  uint32 start = 1;
  uint32 end = 2;
}

message Snippet {
  string text = 1;
  repeated ByteRange highlights = 2;
}

message SearchHit {
  Message message = 1;
  // The ranking score, comparable only within this one streamed response —
  // never across two different queries, rerank passes, or intents (see
  // rank::RankedCandidate's own doc comment).
  //
  // With no L2 rerank this is the L1 ranker's score for this candidate. When
  // a rerank ran it is still drawn from that response's L1 score
  // distribution, but re-assigned to express the reranked order: sorting hits
  // by this field always reproduces the order they were streamed in, which is
  // the property clients need. `why.score` (with `explain`) is always this
  // candidate's own L1 score, and is the one whose feature contributions sum
  // back to it.
  double score = 2;
  Snippet snippet = 3;
  // Which retrievers surfaced this message ("lexical", "dense", "fuzzy",
  // "entity", "structured", "prefix", "recency").
  repeated string sources = 4;
  // Present when SearchRequest.explain was set, and also — carrying only
  // `claude_reason` and `score` — when an L2 Claude rerank produced a reason
  // for this hit, so `mail search --rerank claude` gets the one-line "why"
  // it paid for without also asking for the full feature breakdown.
  RankExplanation why = 5;
  optional int64 thread_id = 6;
  // Sibling messages collapsed into this one by thread_collapse.
  repeated int64 thread_collapsed = 7;
  // Sibling messages collapsed as SimHash near-duplicates.
  repeated int64 near_duplicates = 8;
  // The id of the search that produced this hit — pass it back to
  // `LogFeedback` to attribute an action to this page. Identical on every hit
  // of one response.
  //
  // 0 means this search was not logged, so there is nothing to attribute to:
  // either `search.learning = false` (the opt-out; nothing at all was
  // written) or the stream was superseded by a fresher query before it
  // finished. A client should send no feedback for a 0.
  int64 query_id = 9;
}

message FeatureContribution {
  // FeatureName::as_str()'s stable string — the same key [search.rank_weights]
  // overrides on, never a positional index.
  string name = 1;
  double value = 2;
  double weight = 3;
  // weight * value; summing every contribution's weighted_contribution
  // reproduces RankExplanation.score exactly.
  double weighted_contribution = 4;
}

message RankExplanation {
  // Empty when this explanation exists only to carry `claude_reason` (see
  // SearchHit.why).
  repeated FeatureContribution features = 1;
  // The score the L1 ranker actually produced for this candidate under this
  // query's intent — always this candidate's own, even after an L2 rerank
  // reordered the page (unlike SearchHit.score; see its comment). When
  // `features` is non-empty, summing every
  // FeatureContribution.weighted_contribution reproduces this exactly.
  double score = 2;
  repeated string sources = 3;
  // The matched span(s) prd.md's explainability section asks for.
  Snippet matched = 4;
  // The L2 Claude reranker's one-line "why this matched". Empty when no
  // rerank ran, when the cross-encoder ran (it produces a logit and no
  // prose), or when the rerank degraded to the L1 order.
  string claude_reason = 5;
}

message ExplainRequest {
  string query = 1;
  string filter = 2;
  Intent intent = 3;
  int64 message_id = 4;
  bool thread_collapse = 5;
  int64 account_id = 6;
}

// One relevance judgment: a message the golden set says is a correct answer,
// and how correct.
message Judgment {
  // RFC 5322 `Message-ID` header, verbatim (`"<abc@example.com>"`) — not a
  // `messages.id`. Row ids are assigned by insertion order and change on any
  // resync, so a *versioned* golden set keyed on them would keep parsing
  // fine while silently scoring different mail; see
  // `rmail_core::eval::golden`'s module docs.
  string message_id = 1;
  // Relevance grade, 1..=3 (`rmail_core::eval::metrics::MAX_GAIN`). 0 is
  // read as "unset" and treated as 1 — proto3 cannot distinguish an absent
  // scalar from a zero one, and an ungraded golden set (the common case)
  // sends no gain at all.
  uint32 gain = 2;
}

// One judged query from a golden set.
message GoldenQuery {
  // Stable short name, unique within the request — how a per-query metric is
  // reported and how a regression is attributed.
  string name = 1;
  // The query string, exactly as `mail search` would take it.
  string query = 2;
  // Restrict to one account; 0 = every account.
  int64 account_id = 3;
  repeated Judgment judgments = 4;
}

message EvaluateRequest {
  // Free-form name of the corpus the judgments were made against, echoed
  // back on the report. Never interpreted — it exists so a stored report
  // says which mailbox produced it, since these metrics are corpus-relative
  // and a number from one corpus says nothing about another.
  string corpus = 1;
  repeated GoldenQuery queries = 2;
  // Which retrievers contribute, as `Search`. MODE_UNSPECIFIED defers to the
  // daemon's `search.default_mode` — evaluating the shipped configuration is
  // the default because that is the thing a regression guard is guarding.
  Mode mode = 3;
  // Results to fetch per query. Clamped up to 50: Recall@50 over a shorter
  // page is unmeasurable rather than merely low. 0 = 50.
  uint32 limit = 4;
}

// The four metrics prd.md names, for one query or macro-averaged over a set.
message EvalMetrics {
  double ndcg_at_10 = 1;
  double mrr = 2;
  double recall_at_50 = 3;
  double p_at_3 = 4;
}

message QueryEval {
  string name = 1;
  string query = 2;
  EvalMetrics metrics = 3;
  // Results the pipeline returned, before any metric cutoff.
  uint32 returned = 4;
  // Judged-relevant messages that resolved against this corpus.
  uint32 relevant = 5;
  // Golden `Message-ID`s no message in this corpus matched. Non-empty means
  // the metrics above understate the ranker — the fixture did not seed, or
  // the mailbox is not fully synced — which is a corpus failure, not a
  // relevance one, and is surfaced rather than silently scored as a miss.
  repeated string unresolved = 6;
}

message EvalReport {
  string corpus = 1;
  // One entry per request query, in request order.
  repeated QueryEval per_query = 2;
  // Macro-average across queries: every query weighted equally regardless of
  // how many relevant messages it has.
  EvalMetrics aggregate = 3;
}

// What a user did with a search result. prd.md's implicit-feedback vocabulary
// exactly — "opened, replied to, archived-from-results, dwelled on (and how
// long), scrolled past" — and nothing beyond it: each of the five is
// something the trainer knows how to weight, and an action it cannot weight
// is a row that costs disk and teaches nothing.
enum FeedbackAction {
  FEEDBACK_ACTION_UNSPECIFIED = 0;
  // The result was opened. The baseline positive signal.
  FEEDBACK_ACTION_OPEN = 1;
  // The user replied to the message. The strongest positive.
  FEEDBACK_ACTION_REPLY = 2;
  // Archived straight from the result list — a mild *negative* for this
  // query, not a neutral event.
  FEEDBACK_ACTION_ARCHIVE = 3;
  // Time spent on the message; `ResultAction.dwell_ms` carries how long and
  // is required for this action.
  FEEDBACK_ACTION_DWELL = 4;
  // Skipped over on the way to something lower down the page. What makes a
  // "clicked ≻ skipped-above" preference a pair rather than a lone positive.
  FEEDBACK_ACTION_SCROLL_PAST = 5;
}

// One observation about one result of one search.
message ResultAction {
  // The message acted on (`Message.id`). Must be one this query actually
  // showed: an action about a result that was never on the page has no
  // position and no feature vector to attribute itself to, so it is rejected
  // with INVALID_ARGUMENT rather than stored as a label out of thin air.
  int64 message_id = 1;
  FeedbackAction action = 2;
  // Milliseconds spent on the message. Required for FEEDBACK_ACTION_DWELL —
  // how long *is* the signal — and rejected on every other action, which
  // would otherwise give the same measurement two competing definitions.
  // Capped at 24h: a longer "dwell" is a bug or a forgery, and because
  // long-dwell outranks a plain open, one absurd value would dominate every
  // real signal in the corpus.
  //
  // `optional` rather than a bare int64 because 0 is a real dwell (the user
  // opened and immediately left, which is a genuine negative) and proto3
  // cannot otherwise distinguish it from "not measured".
  optional int64 dwell_ms = 3;
  // When it happened, unix seconds. 0 = the daemon stamps its own clock,
  // which is the right default for a local client on the same machine.
  // Negative is rejected.
  int64 at = 4;
}

message FeedbackRequest {
  // `SearchHit.query_id` from the page these actions are about. 0 is
  // rejected: it is the wire sentinel for "that search was not logged", so
  // there is nothing to attribute to.
  int64 query_id = 1;
  // The batch. Empty is accepted and does nothing; the batch is applied
  // atomically, so a rejected action rejects the whole request rather than
  // leaving a partial picture (a result recorded as skipped that was in fact
  // opened is a wrong training label, not a missing one).
  repeated ResultAction actions = 2;
}
