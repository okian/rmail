syntax = "proto3";

package rmail.v1;

// AccountService manages IMAP/SMTP account configuration. Credentials are never
// carried as plaintext — only a reference describing how to resolve them.
service AccountService {
  // Create a new account.
  rpc Create(CreateAccountRequest) returns (Account);
  // List all configured accounts.
  rpc List(ListAccountsRequest) returns (ListAccountsResponse);
  // Fetch a single account by id.
  rpc Get(GetAccountRequest) returns (Account);
  // Delete an account (cascades to its mailboxes and messages).
  rpc Delete(DeleteAccountRequest) returns (DeleteAccountResponse);
  // Verify the account can log in to its IMAP server (wired in task 8).
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);

  // Start a loopback-redirect OAuth2 + PKCE authorization for an account.
  // Returns the URL the user must open; no token material is ever returned.
  rpc BeginOAuth(BeginOAuthRequest) returns (BeginOAuthResponse);
  // Wait for the browser redirect started by BeginOAuth, exchange the code,
  // and store the refresh token in the Keychain. Blocks until the user
  // consents, the deadline passes, or the RPC is cancelled.
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse);
  // Refresh an account's OAuth access token, reporting the new expiry.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// A configured account. Never includes the password — only how to resolve it.
message Account {
  int64 id = 1;
  string name = 2;
  optional string imap_server = 3;
  optional uint32 imap_port = 4;
  optional string username = 5;
  optional string smtp_server = 6;
  optional uint32 smtp_port = 7;
  // Credential resolution: one of none|command|env|keychain.
  string credential_kind = 8;
  // The command / env var name / keychain service (absent for `none`).
  optional string credential_ref = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

// A credential reference — how to obtain the password, never the password.
message CredentialRef {
  oneof source {
    // A shell command whose stdout is the password.
    string password_command = 1;
    // The name of an environment variable holding the password.
    string password_env = 2;
    // A macOS Keychain generic-password service name.
    string keychain = 3;
    // The Keychain service holding an OAuth2 grant. The account authenticates
    // with XOAUTH2 rather than a password; see AccountService.BeginOAuth.
    string oauth = 4;
  }
}

message CreateAccountRequest {
  string name = 1;
  optional string imap_server = 2;
  optional uint32 imap_port = 3;
  optional string username = 4;
  optional string smtp_server = 5;
  optional uint32 smtp_port = 6;
  // Optional credential reference; absent means no credential.
  CredentialRef credential = 7;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message GetAccountRequest {
  int64 id = 1;
}

message DeleteAccountRequest {
  int64 id = 1;
}

message DeleteAccountResponse {
  bool deleted = 1;
}

message TestConnectionRequest {
  int64 id = 1;
}

message TestConnectionResponse {
  bool ok = 1;
  string detail = 2;
}

message BeginOAuthRequest {
  // The account the grant will belong to.
  int64 account_id = 1;
  // "google"/"gmail" or "microsoft"/"outlook".
  string provider = 2;
  // The OAuth client id of a desktop/native application registered with the
  // provider. Not a secret.
  string client_id = 3;
  // A shell command whose stdout is the client secret, for providers that
  // require one from a native client (Google's "Desktop app" type). The secret
  // itself is never carried over this API — only how to obtain it.
  optional string client_secret_command = 4;
  // Scopes to request; empty means the provider's defaults (mail access only).
  repeated string scopes = 5;
}

message BeginOAuthResponse {
  // Opaque handle identifying this in-flight authorization; pass it to
  // CompleteOAuth.
  string flow_id = 1;
  // The URL the user must open in a browser.
  string authorization_url = 2;
  // The loopback URI the provider will redirect to.
  string redirect_uri = 3;
  // When this flow is abandoned and its port released (unix seconds).
  int64 expires_at = 4;
}

message CompleteOAuthRequest {
  // The handle from BeginOAuthResponse.
  string flow_id = 1;
}

message CompleteOAuthResponse {
  int64 account_id = 1;
  string provider = 2;
  // When the access token just obtained expires (unix seconds).
  int64 expires_at = 3;
  // The scopes the provider actually granted.
  repeated string scopes = 4;
}

message RefreshTokenRequest {
  int64 account_id = 1;
  // Refresh even if the stored token has not expired yet.
  bool force = 2;
}

message RefreshTokenResponse {
  // When the access token expires (unix seconds).
  int64 expires_at = 1;
  // Whether this call went to the provider, or the stored token was still good.
  bool refreshed = 2;
  string provider = 3;
  repeated string scopes = 4;
}
