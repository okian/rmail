syntax = "proto3";

package rmail.v1;

// AnalyticsService answers questions *about* a mailbox rather than about the
// mail in it: how fast you answer, who you keep waiting, what a week of mail
// added up to, and whether any of that is getting better or worse.
//
// Most of it is derived from the local mirror by SQL — no model, no writes,
// no message body — which is why `GetResponseTimes` sits behind `mail.read`.
// `GenerateDigest` is the exception in every one of those respects and is
// scoped accordingly; see its own comment.
service AnalyticsService {
  // Per-contact or per-mailbox response-time percentiles, a rolling trend,
  // and a flag on the correspondences where *you* are the slow side
  // (prd.md feature 58).
  //
  // RESOURCE_EXHAUSTED when the window covers more mail than one report may
  // materialize; the fix is a narrower window or a single account, never a
  // retry. INVALID_ARGUMENT for a window, bucket or ratio the fields below
  // say is out of range.
  rpc GetResponseTimes(GetResponseTimesRequest) returns (GetResponseTimesResponse);

  // A ranked markdown briefing over one window of mail, clustered by
  // thread/topic/sender, with every line linked to the message-ids it came
  // from (prd.md feature 57).
  //
  // Unlike `GetResponseTimes` this reads message bodies, calls Claude, spends
  // against `ai.limits`, and writes a durable row — so it needs both
  // `mail.read` and `ai.invoke`.
  //
  // One window, one stored briefing. The window is resolved first (see the
  // request's own fields) and a briefing already stored for exactly that
  // window is returned as-is with `cached = true`, without a second model
  // call. Only `force` replaces one.
  //
  // Reuse is keyed on the exact bounds, so it only helps a caller that asks
  // for a *fixed* window. Leaving both bounds at 0 does (it resolves to the
  // last completed period); naming `since` alone does not, since the window
  // then ends at "now" and differs on every call. An explicit open-ended
  // window is a fresh model call, by construction.
  //
  // A window ending in the future is accepted and stored, but is deliberately
  // inert to the scheduled job: the timer's cursor ignores rows that have not
  // elapsed, so one such request cannot stop the periodic digest.
  //
  // FAILED_PRECONDITION on a daemon whose AI subsystem is off, or when
  // redaction leaves nothing to brief on. RESOURCE_EXHAUSTED when a spend cap
  // or budget refuses the call. INVALID_ARGUMENT for a window that does not
  // end after it starts. INTERNAL when the model answered but not one line of
  // it cited a message that was actually retrieved — a briefing with no
  // sourced line is not a thinner briefing, it is an unusable one, and it is
  // not stored.
  rpc GenerateDigest(GenerateDigestRequest) returns (GenerateDigestResponse);

  // Everything one correspondence looks like: volume, direction, response
  // symmetry, cadence, recurring topics, a decay report — and, unless
  // `metrics_only`, a one-paragraph Claude briefing with suggested next
  // actions (prd.md feature 59).
  //
  // The numbers are arithmetic over headers. The paragraph is a model call, so
  // this RPC carries `ai.invoke` alongside `mail.read` even though
  // `metrics_only = true` spends nothing: the scope table gates the RPC, not
  // one field of one request.
  //
  // FAILED_PRECONDITION on a daemon whose AI subsystem is off, unless
  // `metrics_only`. INVALID_ARGUMENT for a blank address, a window that does
  // not end after it starts, or a briefing asked for on a correspondence
  // spanning several accounts without `account_id` naming one — AI policy and
  // budget are per account, and guessing which to charge would run a call
  // somebody may have switched off. RESOURCE_EXHAUSTED when the window covers
  // more mail than one report may materialize, or when a spend cap refuses the
  // briefing.
  rpc GetContactInsight(GetContactInsightRequest) returns (GetContactInsightResponse);

  // Which senders are broadcasting at you, how much of it you read, and which
  // are worth leaving (prd.md feature 60).
  //
  // # rmail will not unsubscribe you
  //
  // A detected `List-Unsubscribe` is reported as a **proposal** and nothing
  // more. This daemon does not fetch the URL, does not follow a redirect, does
  // not send the `mailto:`, and exposes no RPC that would. The header is
  // written by the sender — it is attacker-authored text — and a one-click
  // request issued by the user's own daemon confirms the address is live at
  // best and is an SSRF at worst. `Unsubscribe.one_click` reports that the
  // sender advertises RFC 8058; it enables nothing.
  //
  // Classification is headers first (`List-Unsubscribe`, `List-Id`,
  // `Precedence`, `Auto-Submitted`, campaign headers), then behaviour (volume,
  // cadence, read-rate, and whether you have ever replied — a sender you
  // answer is not a subscription whatever its headers say), and only then
  // Claude, for the senders neither could classify. That last step is opt-in
  // per request (`classify_unknown`) and is the only thing here that spends,
  // which is why the RPC carries `ai.invoke`.
  //
  // INVALID_ARGUMENT for a window that does not end after it starts, or when
  // `classify_unknown` is set on senders spanning several accounts without
  // `account_id`. FAILED_PRECONDITION when `classify_unknown` is set on a
  // daemon whose AI subsystem is off. RESOURCE_EXHAUSTED when the window holds
  // more distinct senders than one report may materialize.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);

  // A plain-English analytics question, answered with rows and a short
  // narrative (prd.md feature 61).
  //
  // Claude writes read-only SQLite against six whitelisted views
  // (`analytics_messages`, `analytics_senders`, `analytics_daily`,
  // `analytics_threads`, `analytics_mailboxes`, `analytics_contacts`), and the
  // statement runs inside a SQLite **authorizer** that denies every action
  // except a read reaching one of those views and a call to a fixed function
  // list. The confinement is enforced by SQLite's own name resolution, not by
  // inspecting the string, so a query naming any other table fails at prepare
  // time. Values are bound parameters, never interpolated. Nothing the views
  // project is a message body, a raw octet, a credential or a token.
  //
  // The SQL that ran comes back in the response. A number produced by SQL
  // nobody can see is a number nobody can check.
  //
  // Two model calls when `narrate` is set (one to write the query, one to
  // describe its result), one otherwise. Nothing is cached: the answer depends
  // on data that changes.
  //
  // INVALID_ARGUMENT for an empty or over-long question, for SQL the sandbox
  // refuses (the message names what it tried to reach), for a parameter that
  // does not parse as its declared type, or when several accounts are
  // configured and none is named. FAILED_PRECONDITION on a daemon whose AI
  // subsystem is off. RESOURCE_EXHAUSTED when a spend cap refuses the call.
  rpc AskAnalytics(AskAnalyticsRequest) returns (AskAnalyticsResponse);
}

// Which dimension a response-time report is grouped along.
enum ResponseTimeGroupBy {
  // Treated as RESPONSE_TIME_GROUP_BY_CONTACT.
  RESPONSE_TIME_GROUP_BY_UNSPECIFIED = 0;
  // One group per counterparty address — `mail stats response-time --by contact`.
  RESPONSE_TIME_GROUP_BY_CONTACT = 1;
  // One group per folder the *inbound* message of a pair lives in. Note this
  // is never the Sent folder: a pair is always keyed on the side that was
  // waited for, so grouping by mailbox answers "which folders do I let rot",
  // not "where do my replies end up".
  RESPONSE_TIME_GROUP_BY_MAILBOX = 2;
}

message GetResponseTimesRequest {
  // Restrict to one account. 0 covers every configured account.
  int64 account_id = 1;

  // 0 (UNSPECIFIED) groups by contact.
  ResponseTimeGroupBy group_by = 2;

  // Window bounds in unix seconds, half-open: `since <= t < until`. A pair
  // is in the window when the **reply** was sent inside it, not when the
  // message it answers arrived — "how fast did I respond during March" is a
  // statement about replies written in March.
  //
  // 0 means "since = until - 90 days" and "until = now".
  int64 since = 3;
  int64 until = 4;

  // Trend granularity: one point every `bucket_seconds`, each summarizing the
  // preceding `window_seconds`. 0 means 7 days and 28 days respectively —
  // a weekly point over a rolling four-week window.
  //
  // `window_seconds` must be at least `bucket_seconds`; a window shorter than
  // the step would leave gaps between points and is INVALID_ARGUMENT. The
  // number of points is capped, so a wide range with a tiny bucket is
  // INVALID_ARGUMENT asking for a coarser bucket rather than a silently
  // truncated series.
  int64 bucket_seconds = 5;
  int64 window_seconds = 6;

  // Maximum groups returned. 0 means 50; larger values are clamped to 500.
  // `total_groups` reports how many existed before truncation.
  uint32 limit = 7;

  // How many observations a group needs before the bottleneck rule will fire
  // on it — the evidence bar that stops one slow reply from labelling a
  // relationship. 0 means 3.
  uint32 min_samples = 8;

  // How many times slower than the counterparty your median has to be to
  // count as "slower". 0 means 2.0; anything below 1.0 is INVALID_ARGUMENT,
  // since a ratio under 1 would flag correspondences where you are the
  // *faster* side.
  double bottleneck_ratio = 9;
}

// A percentile summary of one set of response latencies.
//
// Percentiles use the **nearest-rank** method (the value at 1-based rank
// `ceil(p/100 * n)`), not linear interpolation: every number reported here is
// therefore an observation that really happened, which is what makes "p90 is
// 3 days" checkable against a specific message. With `samples = 0` every
// other field is 0 and means nothing — check `samples` first.
message ResponseStats {
  uint64 samples = 1;
  int64 p50_seconds = 2;
  int64 p90_seconds = 3;
  double mean_seconds = 4;
  int64 min_seconds = 5;
  int64 max_seconds = 6;
}

// One contact or one folder.
message ResponseTimeGroup {
  // The grouping key: a lowercased email address, or a folder name.
  //
  // Unique among groups when the report is scoped to one account. With
  // `account_id = 0` and `group_by = MAILBOX` two accounts each contribute an
  // `INBOX`, and they stay *separate* groups sharing one `key` — merging
  // them would report a single median over two unrelated mailboxes.
  // `mailbox_id` is what tells them apart.
  string key = 1;
  // What to show a human: the contact's display name if one is known,
  // otherwise the same text as `key`.
  string label = 2;
  // The folder, when grouping by mailbox; 0 otherwise.
  int64 mailbox_id = 3;

  // How long *you* took to answer them.
  ResponseStats ours = 4;
  // How long *they* took to answer you — the comparison that makes "slow"
  // mean something relative to the correspondence rather than to a global
  // constant.
  ResponseStats theirs = 5;

  // Inbound messages from this contact/in this folder inside the window.
  uint64 inbound = 6;
  // How many of those have no later message of yours anywhere in the same
  // thread — asked over all time, not only inside the window. Reported
  // because a median computed only over the messages you did answer is
  // survivorship bias: never replying is the fastest way to have an excellent
  // p50.
  uint64 awaiting_reply = 7;
  // The subset of `awaiting_reply` that has been sitting longer than you
  // normally take with this contact/folder — your own `ours.p90_seconds`,
  // floored at one day. This, not `awaiting_reply`, is what `stalled` counts:
  // every conversation ends with somebody's message and about half of them
  // end with theirs, so plain "unanswered" describes most healthy
  // correspondence and would make the flag meaningless.
  uint64 overdue = 11;

  // Whether you are the bottleneck here. Exactly
  // `slower_than_counterpart || stalled`; the two component flags are
  // reported so the verdict can be explained rather than trusted.
  bool bottleneck = 8;
  // Your median is at least `bottleneck_ratio` times theirs, with at least
  // `min_samples` observations on both sides.
  bool slower_than_counterpart = 9;
  // At least `min_samples` messages are overdue.
  //
  // Overdue is counted per *sender*: a message only qualifies if you replied
  // to that address at least once inside the window. That is what keeps
  // newsletters, CI mail and cold outreach out — a sender you have never once
  // replied to is not a relationship you are blocking — and it is why the
  // test is on the sender rather than on the group: under
  // `group_by = MAILBOX` one group holds mail from everybody, so a
  // group-level version of this clause would be true of INBOX in every
  // mailbox that exists.
  bool stalled = 10;
}

// One point of the rolling trend, covering `[window_start, window_end)`.
message ResponseTrendPoint {
  // Clamped to the report's `since`, so the earliest points cover a shorter
  // span than `window_seconds` rather than reaching for data the query never
  // read. Compare against `window_end` before reading much into a point.
  int64 window_start = 1;
  int64 window_end = 2;
  // Your own response times only. A trend that mixed in the counterparty's
  // latency would move when *they* changed behavior.
  ResponseStats stats = 3;
}

message GetResponseTimesResponse {
  // The resolved window, after defaults were applied.
  int64 since = 1;
  int64 until = 2;
  ResponseTimeGroupBy group_by = 3;

  // Every pair in the window, ungrouped.
  ResponseStats ours = 4;
  ResponseStats theirs = 5;

  // Groups, most-in-need-of-attention first: flagged groups lead, then by
  // descending median, overdue count and sample count, with the key and the
  // folder id as final tie-breaks so the order is total and a truncated
  // report is reproducible.
  repeated ResponseTimeGroup groups = 6;
  // Groups before `limit` truncation.
  uint32 total_groups = 7;

  repeated ResponseTrendPoint trend = 8;

  // The addresses treated as "you" — read from each account's configured
  // username and from the senders found in its Sent folder. Reported because
  // an empty report is almost always this list being empty, and a caller
  // cannot otherwise tell "you answer nothing" from "rmail does not know who
  // you are".
  repeated string self_addresses = 9;

  // Reply/original pairs matched in the window, both directions.
  uint64 pairs = 10;
  // Pairs discarded because the reply's timestamp preceded the message it
  // answers. A negative latency is a clock or a forged `Date` header, not a
  // fast reply, and averaging it in would drag every percentile down.
  uint64 skipped_out_of_order = 11;
}

// ---------------------------------------------------------------------------
// GenerateDigest (prd.md feature 57, task 70)
// ---------------------------------------------------------------------------

message GenerateDigestRequest {
  // Restrict to one account. 0 covers every configured account, and is the
  // scope the scheduled job itself uses — a briefing about "my mail" is not
  // per-mailbox.
  int64 account_id = 1;

  // Window bounds in unix seconds, half-open: `since <= t < until`. A message
  // is in the window when its own `Date` (falling back to the IMAP
  // INTERNALDATE) is.
  //
  // Both 0 means "the most recently completed period on the configured
  // cadence" (`digest.interval`, one day by default) — the same window the
  // scheduled job would have produced, so `mail digest` with no flags asks
  // for exactly what the timer would have. Naming `since` alone means "since
  // then, up to now"; naming `until` alone means "one cadence ending there".
  int64 since = 2;
  int64 until = 3;

  // Regenerate rather than returning a briefing already stored for this
  // window. Costs a second model call and replaces the stored row; the
  // scheduler never sets it.
  bool force = 4;
}

// One source the briefing was built from. The label is what the model was
// shown and what the citation layer resolved; `message_id` is what the
// rendered markdown carries inline.
message DigestSource {
  uint32 label = 1;
  int64 message_id = 2;
  int64 message_uid = 3;
  int64 account_id = 4;
  string mailbox = 5;
  string subject = 6;
  string from_addr = 7;
  // 0 when the message has no date.
  int64 date = 8;
  // Whether a surviving line of the briefing actually pointed at this source.
  // A packed-but-uncited source is context the model was given and did not
  // use, which is worth telling apart from one it did.
  bool cited = 9;
}

// One line of the briefing, and the messages it is drawn from.
message DigestLine {
  // The line as rendered, citations included. Never empty, and never without
  // at least one citation.
  string text = 1;
  // `messages.id` for every source this line cited, in the order it named
  // them. Never empty — a line that cited nothing is not returned.
  repeated int64 message_ids = 2;
}

// One section of the briefing. All five are always present, in the fixed
// order below, whether or not they hold lines.
message DigestSection {
  // Stable identifier: `needs_reply`, `fyi`, `waiting_on`, `auto_handled` or
  // `skipped`. Match on this, not on `heading`.
  string id = 1;
  // The heading as it appears in `markdown`.
  string heading = 2;
  repeated DigestLine lines = 3;
}

message GenerateDigestResponse {
  // `digests.id` — the durable row this briefing is stored as.
  int64 digest_id = 1;
  // The resolved window, after defaults were applied.
  int64 since = 2;
  int64 until = 3;
  int64 account_id = 4;
  // When the stored briefing was written; for a cached one this is when it
  // was *first* produced, not now.
  int64 generated_at = 5;

  // The briefing as markdown: five `## ` headings in a fixed order, bullets
  // beneath them, `_none_` where a section is empty. Rendered by the daemon
  // from `sections` — only the prose inside a bullet is the model's, and
  // every citation in it is a `[msg:<id>]` the daemon resolved.
  string markdown = 6;
  repeated DigestSection sections = 7;
  repeated DigestSource sources = 8;

  // The model that actually wrote it, after any budget downgrade. Empty when
  // no model was called — see `empty`.
  string model = 9;

  // Messages in the window that were considered, how many entered the prompt,
  // how many the AI policy withheld, and how many clusters they were grouped
  // into. Reported because a thin briefing and a quiet week look the same in
  // `markdown` and are very different facts.
  uint64 considered = 10;
  uint64 packed = 11;
  uint64 withheld_by_policy = 12;
  uint64 clusters = 13;

  // Whether this briefing was read back rather than generated. A cached
  // response made no model call and cost nothing.
  bool cached = 14;
  // Whether the window held nothing to brief. An empty window produces the
  // same five-section document with every section empty, and — deliberately —
  // no model call at all.
  bool empty = 15;
}

// ---------------------------------------------------------------------------
// GetContactInsight (prd.md feature 59, task 72)
// ---------------------------------------------------------------------------

message GetContactInsightRequest {
  // Restrict to one account. 0 covers every configured account.
  //
  // Naming one is also how a briefing picks whose AI policy and budget to
  // charge. Left at 0, the daemon uses the single account the correspondence
  // was found in, and refuses with INVALID_ARGUMENT when there is more than
  // one — see the RPC comment.
  int64 account_id = 1;

  // The counterparty, as an email address. Lowercased and trimmed before
  // anything else happens, so the report for `Ada@Example.COM` and the report
  // for `ada@example.com` are the same report.
  string address = 2;

  // Window bounds in unix seconds, half-open: `since <= t < until`.
  //
  // 0 means "since = until - 365 days" and "until = now". A year rather than
  // the response-time report's ninety days, because "is this going quiet" is a
  // question a quarter cannot answer.
  int64 since = 3;
  int64 until = 4;

  // Maximum topics returned. 0 means 8; larger values are clamped to 50.
  uint32 topic_limit = 5;

  // Skip the model call. The response then carries every number and an empty
  // `briefing`, and costs nothing. `mail contact <addr>` sets it; `mail
  // contact <addr> --insight` does not.
  bool metrics_only = 6;
}

// How much mail went each way.
message ContactVolume {
  uint64 inbound = 1;
  uint64 outbound = 2;
  // Distinct threads the two of you share inside the window.
  uint64 threads = 3;
  // Outbound as a share of the total, in [0, 1]. 0 when there is no mail at
  // all — check `inbound + outbound` before reading it.
  double direction_ratio = 4;
  // 0 when unknown.
  int64 first_seen = 5;
  int64 last_inbound = 6;
  int64 last_outbound = 7;
}

// How often the two of you exchange mail.
message ContactCadence {
  // Median gap between consecutive messages either way. 0 with fewer than two
  // messages, where a gap does not exist.
  int64 median_gap_seconds = 1;
  int64 longest_gap_seconds = 2;
  // Messages either way per seven days, scaled by the *window* rather than by
  // the observed span — so a contact who wrote twice on one day a year ago
  // does not read as a daily correspondent.
  double messages_per_week = 3;
}

// Whether the relationship is going quiet.
message ContactDecay {
  // Seconds since the most recent message either way. 0 when there was none.
  int64 silence_seconds = 1;
  // How long a silence must run to count as dormant here: three times this
  // pair's own median cadence, floored at 30 days. Reported because "dormant"
  // means something different for a daily correspondent than for an annual
  // one, and a flag whose threshold is invisible cannot be argued with.
  int64 dormant_after_seconds = 2;
  // Messages in the later and earlier halves of the window.
  uint64 recent_messages = 3;
  uint64 prior_messages = 4;
  // recent / prior. 0 when the earlier half was empty — a correspondence that
  // started inside the window has no trend yet, and reporting "infinite
  // growth" would be worse than reporting nothing.
  double change_ratio = 5;
  bool dormant = 6;
  // The recent half is under half the earlier half.
  bool declining = 7;
}

// One recurring subject term.
message ContactTopic {
  string term = 1;
  // Messages in the window whose subject carried it. Counted per message, so a
  // subject repeating a word six times contributes one.
  uint64 messages = 2;
}

message GetContactInsightResponse {
  string address = 1;
  // The most recent display name seen for them; empty when none.
  string name = 2;
  // The resolved window.
  int64 since = 3;
  int64 until = 4;

  ContactVolume volume = 5;
  // Response-time percentiles for this correspondence, computed by exactly the
  // rules `GetResponseTimes` uses — same pairing, same direction test, same
  // nearest-rank percentiles.
  ResponseStats ours = 6;
  ResponseStats theirs = 7;
  // theirs.p50 / ours.p50: above 1 means they are slower than you, below 1
  // means you are slower than them. 0 unless both sides have an observation.
  double symmetry = 8;

  // Messages of theirs with no later message of yours in the same thread, and
  // the subset that has waited longer than you normally take with this person.
  uint64 awaiting_reply = 9;
  uint64 overdue = 10;

  ContactCadence cadence = 11;
  ContactDecay decay = 12;
  repeated ContactTopic topics = 13;

  // Claude's paragraph. Empty when `metrics_only` was set, and also when the
  // window held no mail at all — there is nothing to brief and no account to
  // charge, so no call is made.
  string briefing = 14;
  // Suggested next actions, at most 5. Often empty, deliberately: the prompt
  // says an empty list is a valid answer.
  repeated string next_actions = 15;
  // The model that wrote the briefing, after any budget downgrade. Empty when
  // none was called.
  string model = 16;

  // The accounts this correspondence was found in. Reported because "no mail
  // at all" and "mail in two accounts" are different answers to an empty
  // briefing, and the second is what INVALID_ARGUMENT asks you to resolve.
  repeated int64 accounts = 17;
}

// ---------------------------------------------------------------------------
// ListSubscriptions (prd.md feature 60, task 72)
// ---------------------------------------------------------------------------

message ListSubscriptionsRequest {
  // Restrict to one account. 0 covers every configured account, and is also
  // how `classify_unknown` picks whose budget to charge — see the RPC comment.
  int64 account_id = 1;

  // Window bounds in unix seconds, half-open. 0 means "since = until - 180
  // days" and "until = now".
  int64 since = 2;
  int64 until = 3;

  // Maximum senders returned. 0 means 50; larger values are clamped to 500.
  uint32 limit = 4;

  // Return only senders flagged as unsubscribe candidates.
  bool candidates_only = 5;

  // Ask Claude about senders headers and behaviour could not classify. Costs
  // one provider call; the only field here that spends anything.
  bool classify_unknown = 6;
}

// What a sender is.
enum SubscriptionClass {
  SUBSCRIPTION_CLASS_UNSPECIFIED = 0;
  // Bulk mail you subscribed to: a newsletter, a digest, a mailing list.
  SUBSCRIPTION_CLASS_NEWSLETTER = 1;
  // Machine mail about one thing you did: a receipt, a reset, a delivery.
  // Split from NEWSLETTER because leaving it is usually neither possible nor
  // desirable.
  SUBSCRIPTION_CLASS_TRANSACTIONAL = 2;
  // Machine mail that is neither: monitoring, build results, no-reply
  // broadcasts.
  SUBSCRIPTION_CLASS_AUTOMATED = 3;
  // A human writing to you.
  SUBSCRIPTION_CLASS_PERSONAL = 4;
  // Not enough signal. The only class Claude is ever asked about.
  SUBSCRIPTION_CLASS_UNKNOWN = 5;
}

// Where a classification came from.
enum SubscriptionSource {
  SUBSCRIPTION_SOURCE_UNSPECIFIED = 0;
  // A List-*/Precedence/Auto-Submitted header said so.
  SUBSCRIPTION_SOURCE_HEADER = 1;
  // Volume, cadence, read-rate or a reply of yours said so.
  SUBSCRIPTION_SOURCE_HEURISTIC = 2;
  // Claude was asked, because the other two had nothing.
  SUBSCRIPTION_SOURCE_MODEL = 3;
}

// What the sender says leaving involves.
//
// A **proposal**, never an action. rmail does not fetch `http_url`, does not
// follow a redirect and does not send to `mailto` — see the RPC comment.
message Unsubscribe {
  // An `https:` URL the sender advertises; empty when it offered none.
  //
  // Plain `http:` is deliberately dropped rather than reported: a cleartext
  // unsubscribe is a tracking beacon with a downgrade attack attached, and
  // handing one to a human as "the method" would be endorsing it.
  string http_url = 1;
  // A `mailto:` address, with the sender-chosen `?subject=`/`?body=` stripped
  // — those describe a message the sender wants sent *from the user's
  // address*, and they are not carried.
  string mailto = 2;
  // The sender advertises RFC 8058 one-click
  // (`List-Unsubscribe-Post: List-Unsubscribe=One-Click`). Reported so a human
  // knows leaving should take one step rather than a login. It enables
  // nothing.
  bool one_click = 3;
}

// One sender.
message SubscriptionSender {
  int64 account_id = 1;
  string address = 2;
  // Most recent display name; empty when none.
  string name = 3;

  uint64 messages = 4;
  uint64 read_messages = 5;
  // read_messages / messages, in [0, 1].
  double read_rate = 6;
  // 0 when unknown.
  int64 first_seen = 7;
  int64 last_seen = 8;
  // Median gap between consecutive messages. 0 with fewer than two.
  int64 median_gap_seconds = 9;

  // Messages of yours in this sender's threads. A sender you answer is not a
  // subscription whatever its headers say, and this is the signal that says so.
  uint64 your_replies = 10;

  SubscriptionClass sender_class = 11;
  SubscriptionSource source = 12;
  // The named signals behind the verdict (`list-unsubscribe`, `list-id`,
  // `precedence-bulk`, `auto-submitted`, `campaign-header`, `no-reply-sender`,
  // `you-have-replied`, `regular-cadence`, `mostly-unread`, `model`), so a
  // classification can be interrogated rather than trusted.
  repeated string signals = 13;

  // What the sender says leaving involves. Absent when it says nothing, and
  // also when its headers were never read.
  Unsubscribe unsubscribe = 14;
  // Whether a header block was actually read for this sender. False past the
  // probe cap — and "no unsubscribe header" and "we did not look" are
  // different facts.
  bool headers_read = 15;

  // Worth leaving: a newsletter or automated class, a read-rate at or below
  // 0.2 over at least 5 messages, no replies of yours, and an unsubscribe
  // method a human could act on.
  bool candidate = 16;
}

message ListSubscriptionsResponse {
  // The resolved window.
  int64 since = 1;
  int64 until = 2;

  // Senders, candidates first and then by unread volume, with the address and
  // account as final tie-breaks so a truncated report is reproducible.
  repeated SubscriptionSender senders = 3;
  // Senders before `limit` truncation.
  uint32 total_senders = 4;
  // How many header blocks were read. Below `total_senders` past the probe
  // cap.
  uint32 headers_read = 5;
  // How many senders Claude classified. 0 unless `classify_unknown` was set.
  uint32 model_classified = 6;
  // The model that answered, after any budget downgrade. Empty when none was
  // called.
  string model = 7;
}

// ---------------------------------------------------------------------------
// AskAnalytics (prd.md feature 61, task 72)
// ---------------------------------------------------------------------------

message AskAnalyticsRequest {
  // Restrict to one account. 0 asks across every configured account.
  //
  // A filter, not a boundary: `mail.read` is not per-account anywhere in this
  // daemon, and claiming otherwise here would invent a guarantee the auth
  // layer does not make. It is also what picks whose AI budget the call is
  // charged to; left at 0 with several accounts configured, the RPC refuses
  // rather than guessing.
  int64 account_id = 1;

  // The question, in plain English. At most 500 characters.
  string question = 2;

  // Also write a short narrative over the rows. Costs a second model call.
  // `mail ask --json` leaves it off.
  bool narrate = 3;
}

// One value from a result row.
//
// A oneof rather than a string, so a client can format a count as a count and
// a timestamp as a date without re-parsing. `unsupported` is what a column
// this surface does not carry (today, only a blob) comes back as — none of the
// whitelisted views project one, so it should never be seen.
message AnalyticsCell {
  oneof value {
    bool null_value = 1;
    int64 integer_value = 2;
    double real_value = 3;
    string text_value = 4;
    bool unsupported = 5;
  }
}

message AnalyticsRow {
  repeated AnalyticsCell cells = 1;
}

message AskAnalyticsResponse {
  // The question as asked, trimmed.
  string question = 1;
  // The SQL that ran, with `?` placeholders. Returned because a number
  // produced by SQL nobody can see is a number nobody can check.
  string sql = 2;
  // The bound parameters, rendered as `kind:value` in placeholder order.
  repeated string params = 3;
  // The model's one-line note about what it understood, for a human to read
  // next to the numbers.
  string notes = 4;

  repeated string columns = 5;
  repeated AnalyticsRow rows = 6;
  // Whether the row cap stopped the statement short. A narrative written over
  // a truncated result is told so and says so.
  bool truncated = 7;

  // The narrative. Empty when `narrate` was not set.
  string narrative = 8;
  // How many rows the narrating call was actually shown — below `rows` for a
  // large result, so "the top few" can be checked against what it saw.
  uint32 narrative_rows = 9;

  // The model that answered, after any budget downgrade.
  string model = 10;
}
