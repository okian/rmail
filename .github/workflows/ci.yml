name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt · clippy · buf · test · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: brew install protobuf

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The local embedding backend reads its weights from here. Cached across
      # runs so the model is fetched once rather than on every job, and so the
      # tests that exercise the real model actually run — without it they
      # detect an empty cache and skip, which is the same as not having them.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/rmail/models
          key: rmail-models-bge-small-en-v1.5

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: buf lint
        run: buf lint

      - name: test
        run: cargo nextest run --all-features --workspace
        env:
          # Allow the one-time weight download on a cold cache. Opt-in because
          # a unit test may not decide to pull a few hundred megabytes onto a
          # developer's metered connection.
          RMAIL_ONNX_TESTS: "1"

      # The documented degraded build: no ONNX, semantic search falls back to
      # deterministic hashed vectors. It has its own `#[cfg]` paths, so a build
      # that only ever compiles with every feature on does not cover it.
      - name: test without the local model backend
        run: cargo nextest run --no-default-features --workspace

      - name: build release
        run: cargo build --release
