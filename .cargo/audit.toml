# `cargo audit` config (auto-discovered from `./.cargo/audit.toml`; no CLI
# flags needed — CI and a local `cargo audit` run identically). Companion to
# the `[advisories]` section of `deny.toml` at the repo root, which is where
# the actual rationale for each ignored RUSTSEC id lives; kept here too
# because `cargo deny` and `cargo audit` are two different tools with two
# different config schemas; there's no single file both can read. Whichever
# of the two you're updating, check the other before changing an ignore —
# removing an id from only one leaves that advisory silently unenforced by
# whichever tool still ignores it.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste, unmaintained — see deny.toml
    "RUSTSEC-2026-0192", # ttf-parser, unmaintained — see deny.toml
    "RUSTSEC-2025-0134", # rustls-pemfile, unmaintained via tonic 0.12 — see deny.toml
    "RUSTSEC-2026-0253", # lru 0.12 unsound via ratatui 0.29 — see deny.toml
    "RUSTSEC-2026-0002", # lru 0.12 unsound via ratatui 0.29 — see deny.toml
    # The one entry here that is an actual *vulnerability* rather than an
    # unmaintained/unsound finding, and the only one whose rationale is
    # load-bearing rather than "nothing to bump to": it holds solely because
    # this workspace performs no RSA *private-key* operation, so there is no
    # decryption oracle to time. Read the full note in deny.toml before
    # inheriting this — it stops being true the moment decryption of incoming
    # mail lands. It was present in deny.toml and missing here, which is the
    # exact drift the header warns about: `cargo deny` passed it while
    # `cargo audit` failed on it.
    "RUSTSEC-2023-0071", # rsa 0.9 Marvin attack via pgp — see deny.toml
]

[output]
# Escalates "unmaintained"/"unsound"/"notice" advisories (informational by
# default; `cargo audit` only fails the exit code on an actual vulnerability
# without this) to real failures too — RUSTSEC-2026-0221 (event-listener,
# "unsound") was caught and fixed this way during this task; without `deny =
# ["warnings"]` it would only have printed, not failed the build.
deny = ["warnings"]
# Not actually quiet — `cargo-audit` 0.22.2's `[output]` table requires this
# field once the table is present at all (unlike its siblings, it has no
# `#[serde(default)]` in cargo-audit's own config schema); `false` keeps the
# normal verbose report.
quiet = false
