[package]
name = "rmaild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rmail daemon: background sync, indexing, ranking, AI, and the gRPC server."
# Not published to crates.io — ships as a binary release (see
# `scripts/package-macos.sh`), not a library. Lets `deny.toml`'s
# `bans.allow-wildcard-paths` distinguish an unversioned `path` dependency on
# a sibling crate (harmless, always local) from a real external wildcard
# dependency (a supply-chain risk worth denying).
publish = false

[lib]
name = "rmaild"
path = "src/lib.rs"

[[bin]]
name = "rmaild"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["onnx"]
# Forwarded so `--workspace --no-default-features` actually builds the degraded
# daemon. Without it, this crate's default-features dependency on `rmail-core`
# re-enables ONNX and the "no model" path is never compiled, let alone tested.
onnx = ["rmail-core/onnx"]

[dependencies]
rmail-proto.workspace = true
rmail-core.workspace = true
# `search_service.rs` captures one reference instant (`Utc::now()`) per
# request and threads it through `QueryPlanner::plan_at`/
# `FeatureExtractor::extract_at` so a replayed request scores identically —
# see that module's own docs.
chrono.workspace = true
# `send_scheduler_service.rs` resolves a request's IANA zone (`tz`) before
# handing it to `rmail_core::outbox::schedule`, so the handler names the type
# that carries it.
chrono-tz.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
http.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `ai_service.rs` relays `rmail_core::ai::provider::ProviderStream` frames
# (a `futures::Stream`) and implements `Provider` for its `NullProvider`
# fallback.
futures.workspace = true
async-trait.workspace = true
# `ai_service.rs` reads `ai_summaries`/`ai_entities`/`ai_usage`/`ai_queue`
# directly for GetSummary/StreamEnrichments/GetUsage — the same "a service
# handler runs its own narrow SQL through `Database::read`" pattern
# `search_service.rs`/`mail_service.rs` already use.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# The idempotency fence hashes the *encoded* request and caches the encoded
# response, so `idempotency.rs` needs prost's `Message` at runtime and not only
# in the descriptor-set test below.
prost.workspace = true
# `mcp::descriptor` decodes the compiled `FileDescriptorSet` at runtime to
# derive the MCP tool surface (task 53) — the same set `auth::methods`' tests
# decode, which is why this moved out of `[dev-dependencies]`.
prost-types.workspace = true
# `mcp::codec` renders proto `bytes` fields as base64, which is what proto3
# JSON specifies and what an MCP client expects to receive.
base64.workspace = true
# `mcp::invoke`'s `tonic::codec::Codec` implementation reads and writes
# message bodies through `Buf`/`BufMut`.
bytes.workspace = true
# `mcp::transport::session_id` needs the OS CSPRNG: an SSE session id is the
# only thing between a POST and this server's whole authority, so it cannot be
# a counter. `argon2` re-exports `rand_core`'s `OsRng`, which is the same
# source `rmail_core::auth::mint` draws a bearer secret from — one RNG in the
# workspace rather than a second crate for sixteen bytes.
argon2.workspace = true
# The MCP SSE transport (`mcp::transport`): an HTTP/1.1 server on loopback.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
tonic-types.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Only used by the AuditService integration test, to verify a ledger entry's
# `payload_sha256` against an independently computed hash.
sha2.workspace = true
