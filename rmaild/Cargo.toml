[package]
name = "rmaild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rmail daemon: background sync, indexing, ranking, AI, and the gRPC server."
# Not published to crates.io — ships as a binary release (see
# `scripts/package-macos.sh`), not a library. Lets `deny.toml`'s
# `bans.allow-wildcard-paths` distinguish an unversioned `path` dependency on
# a sibling crate (harmless, always local) from a real external wildcard
# dependency (a supply-chain risk worth denying).
publish = false

[lib]
name = "rmaild"
path = "src/lib.rs"

[[bin]]
name = "rmaild"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["onnx"]
# Forwarded so `--workspace --no-default-features` actually builds the degraded
# daemon. Without it, this crate's default-features dependency on `rmail-core`
# re-enables ONNX and the "no model" path is never compiled, let alone tested.
onnx = ["rmail-core/onnx"]

[dependencies]
rmail-proto.workspace = true
rmail-core.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
http.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tonic-types.workspace = true
# Decoding the compiled descriptor set so the auth scope table can be checked
# against the RPCs actually served (see `auth::methods` tests).
prost.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Only used by the AuditService integration test, to verify a ledger entry's
# `payload_sha256` against an independently computed hash.
sha2.workspace = true
